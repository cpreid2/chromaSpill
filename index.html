  gl.uniform1i(gl.getUniformLocation(program, "uAuxB"), 10);

  gl.uniform3f(uWater, 184 / 255, 176 / 255, 162 / 255);

  const PASS_DISPLAY = 0, PASS_BACK = 1, PASS_FWD = 2, PASS_IDENTITY = 3;
  const PASS_BAKE = 4, PASS_STAMP = 5, PASS_CLEAR = 6, PASS_SPLAT = 7;
  const PASS_ADVECT_SURF = 8, PASS_SURF_RHS = 9, PASS_MG_SMOOTH = 10, PASS_ZERO = 11;
  const PASS_MG_RESTRICT = 12, PASS_MG_PROLONG = 13, PASS_WARM_START = 14;
  const PASS_VORTICITY = 15, PASS_ADVECT_INERTIAL = 16, PASS_NS_DIV = 17;
  const PASS_NS_PROJECT = 18, PASS_COMBINE_VEL = 19, PASS_REDISTANCE = 20, PASS_ENERGY = 21;

  function makeTarget(w, h, internal, format, type) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fbo, w, h };
  }

  const inkTex = [
    makeTarget(INK, INK, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT),
    makeTarget(INK, INK, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT)
  ];
  const back = [makeTarget(MAP, MAP, gl.RG32F, gl.RG, gl.FLOAT), makeTarget(MAP, MAP, gl.RG32F, gl.RG, gl.FLOAT)];
  const fwd = [makeTarget(MAP, MAP, gl.RG32F, gl.RG, gl.FLOAT), makeTarget(MAP, MAP, gl.RG32F, gl.RG, gl.FLOAT)];

  const surfTex = [makeTarget(SIM, SIM, gl.RG32F, gl.RG, gl.FLOAT), makeTarget(SIM, SIM, gl.RG32F, gl.RG, gl.FLOAT)];
  const inertVelTex = [makeTarget(SIM, SIM, gl.RG32F, gl.RG, gl.FLOAT), makeTarget(SIM, SIM, gl.RG32F, gl.RG, gl.FLOAT)];
  const velTex = makeTarget(SIM, SIM, gl.RG32F, gl.RG, gl.FLOAT);
  const curlTex = makeTarget(SIM, SIM, gl.R32F, gl.RED, gl.FLOAT);
  let phiTex = makeTarget(SIM, SIM, gl.R32F, gl.RED, gl.FLOAT);
  let pressTex = makeTarget(SIM, SIM, gl.R32F, gl.RED, gl.FLOAT);

  const mgSol = [];
  const mgRhs = [];
  for (let l = 0; l < MG_LEVELS; l++) {
    const sz = SIM >> l;
    mgSol.push([
      makeTarget(sz, sz, gl.R32F, gl.RED, gl.FLOAT),
      makeTarget(sz, sz, gl.R32F, gl.RED, gl.FLOAT)
    ]);
    mgRhs.push(makeTarget(sz, sz, gl.R32F, gl.RED, gl.FLOAT));
  }

  const energyTarget = makeTarget(ENERGY_RES, ENERGY_RES, gl.R32F, gl.RED, gl.FLOAT);
  const energyPbo = gl.createBuffer();
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, energyPbo);
  gl.bufferData(gl.PIXEL_PACK_BUFFER, ENERGY_RES * ENERGY_RES * 4, gl.STREAM_READ);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  const energyReadBuf = new Float32Array(ENERGY_RES * ENERGY_RES);
  let pendingSync = null;

  let inkI = 0, backI = 0, fwdI = 0, surfI = 0, inertI = 0;

  function bindInputs(targetTex, auxATex = null, auxBTex = null) {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, targetTex === inkTex[inkI].tex ? null : inkTex[inkI].tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, targetTex === back[backI].tex ? null : back[backI].tex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, targetTex === fwd[fwdI].tex ? null : fwd[fwdI].tex);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, targetTex === velTex.tex ? null : velTex.tex);
    gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, targetTex === surfTex[surfI].tex ? null : surfTex[surfI].tex);
    gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, targetTex === phiTex.tex ? null : phiTex.tex);
    gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, targetTex === inertVelTex[inertI].tex ? null : inertVelTex[inertI].tex);
    gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D, targetTex === pressTex.tex ? null : pressTex.tex);
    gl.activeTexture(gl.TEXTURE8); gl.bindTexture(gl.TEXTURE_2D, targetTex === curlTex.tex ? null : curlTex.tex);
    gl.activeTexture(gl.TEXTURE9); gl.bindTexture(gl.TEXTURE_2D, (auxATex && targetTex !== auxATex) ? auxATex : null);
    gl.activeTexture(gl.TEXTURE10); gl.bindTexture(gl.TEXTURE_2D, (auxBTex && targetTex !== auxBTex) ? auxBTex : null);
    gl.activeTexture(gl.TEXTURE0);
  }

  function drawTo(target, pass, auxATex = null, auxBTex = null) {
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    gl.uniform1i(uIsExportLoc, 0);

    if (!target) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, view.width, view.height);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
      gl.viewport(0, 0, target.w, target.h);
      gl.uniform1f(uTargetSize, target.w);
    }

    gl.uniform1i(uPass, pass);
    bindInputs(target ? target.tex : null, auxATex, auxBTex);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function solveMultigridVCycle(alpha, numVCycles) {
    gl.uniform1f(uAlphaLoc, alpha);
    const curIdx = new Int32Array(MG_LEVELS);

    for (let cycle = 0; cycle < numVCycles; cycle++) {
      for (let l = 0; l < MG_LEVELS - 1; l++) {
        const preSmoothSteps = (l === 0) ? 2 : 3;
        for (let s = 0; s < preSmoothSteps; s++) {
          const src = curIdx[l];
          const dst = 1 - src;
          drawTo(mgSol[l][dst], PASS_MG_SMOOTH, mgSol[l][src].tex, mgRhs[l].tex);
          curIdx[l] = dst;
        }
        drawTo(mgRhs[l + 1], PASS_MG_RESTRICT, mgSol[l][curIdx[l]].tex, mgRhs[l].tex);
        drawTo(mgSol[l + 1][0], PASS_ZERO);
        curIdx[l + 1] = 0;
      }

      const coarsest = MG_LEVELS - 1;
      for (let s = 0; s < 10; s++) {
        const src = curIdx[coarsest];
        const dst = 1 - src;
        drawTo(mgSol[coarsest][dst], PASS_MG_SMOOTH, mgSol[coarsest][src].tex, mgRhs[coarsest].tex);
        curIdx[coarsest] = dst;
      }

      for (let l = MG_LEVELS - 2; l >= 0; l--) {
        const src = curIdx[l];
        const dst = 1 - src;
        drawTo(mgSol[l][dst], PASS_MG_PROLONG, mgSol[l][src].tex, mgSol[l + 1][curIdx[l + 1]].tex);
        curIdx[l] = dst;

        const postSmoothSteps = (l === 0) ? 2 : 3;
        for (let s = 0; s < postSmoothSteps; s++) {
          const sSrc = curIdx[l];
          const sDst = 1 - sSrc;
          drawTo(mgSol[l][sDst], PASS_MG_SMOOTH, mgSol[l][sSrc].tex, mgRhs[l].tex);
          curIdx[l] = sDst;
        }
      }
    }
    return curIdx[0];
  }

  function pollAsyncGpuActivity(isActivelyWorking) {
    if (isActivelyWorking) {
      if (pendingSync) {
        gl.deleteSync(pendingSync);
        pendingSync = null;
      }
      return;
    }

    if (pendingSync) {
      const status = gl.clientWaitSync(pendingSync, 0, 0);
      if (status === gl.ALREADY_SIGNALED || status === gl.CONDITION_SATISFIED) {
        gl.deleteSync(pendingSync);
        pendingSync = null;

        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, energyPbo);
        gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, energyReadBuf);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);

        let maxActivity = 0;
        for (let i = 0; i < energyReadBuf.length; i++) {
          if (energyReadBuf[i] > maxActivity) maxActivity = energyReadBuf[i];
        }

        if (maxActivity <= 0.00045) {
          isSpreading = false;
          drawTo(velTex, PASS_ZERO);
          drawTo(inertVelTex[0], PASS_ZERO);
          drawTo(inertVelTex[1], PASS_ZERO);
        }
      }
    } else if (stepCount % 10 === 0) {
      drawTo(energyTarget, PASS_ENERGY);
      gl.bindFramebuffer(gl.FRAMEBUFFER, energyTarget.fbo);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, energyPbo);
      gl.readPixels(0, 0, ENERGY_RES, ENERGY_RES, gl.RED, gl.FLOAT, 0);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      pendingSync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    }
  }

  function exportHighRes(mimeType, isSvg = false) {
    const exportSize = isSvg ? 4096 : INK;

    const exportFbo = gl.createFramebuffer();
    const exportTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, exportTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, exportSize, exportSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, exportFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, exportTex, 0);

    gl.viewport(0, 0, exportSize, exportSize);
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    gl.uniform1i(uIsExportLoc, 1);
    gl.uniform1i(uPass, PASS_DISPLAY);
    gl.uniform1f(uTargetSize, exportSize);

    bindInputs(null);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.uniform1i(uIsExportLoc, 0);

    const pixels = new Uint8Array(exportSize * exportSize * 4);
    gl.readPixels(0, 0, exportSize, exportSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

    gl.deleteTexture(exportTex);
    gl.deleteFramebuffer(exportFbo);

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = exportSize;
    tempCanvas.height = exportSize;
    const ctx = tempCanvas.getContext("2d");
    const imgData = ctx.createImageData(exportSize, exportSize);

    for (let y = 0; y < exportSize; y++) {
      const topY = exportSize - 1 - y;
      const srcOffset = y * exportSize * 4;
      const dstOffset = topY * exportSize * 4;
      imgData.data.set(pixels.subarray(srcOffset, srcOffset + exportSize * 4), dstOffset);
    }

    ctx.putImageData(imgData, 0, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, view.width, view.height);

    return tempCanvas.toDataURL(mimeType, 1.0);
  }

  function gpuClear() {
    if (pendingSync) {
      gl.deleteSync(pendingSync);
      pendingSync = null;
    }
    drawTo(inkTex[1 - inkI], PASS_CLEAR); inkI = 1 - inkI;
    drawTo(back[1 - backI], PASS_IDENTITY); backI = 1 - backI;
    drawTo(fwd[1 - fwdI], PASS_IDENTITY); fwdI = 1 - fwdI;
    drawTo(surfTex[0], PASS_ZERO); drawTo(surfTex[1], PASS_ZERO);
    drawTo(inertVelTex[0], PASS_ZERO); drawTo(inertVelTex[1], PASS_ZERO);
    drawTo(phiTex, PASS_ZERO);
    drawTo(pressTex, PASS_ZERO);
    drawTo(velTex, PASS_ZERO);
    drawTo(curlTex, PASS_ZERO);
    stepCount = 0;
    isSpreading = false;
    hasAdvectedSinceBake = false;
  }

  function gpuBake() {
    if (!hasAdvectedSinceBake) return;
    drawTo(inkTex[1 - inkI], PASS_BAKE); inkI = 1 - inkI;
    for (let r = 0; r < 2; r++) {
      drawTo(inkTex[1 - inkI], PASS_REDISTANCE);
      inkI = 1 - inkI;
    }
    drawTo(back[1 - backI], PASS_IDENTITY); backI = 1 - backI;
    drawTo(fwd[1 - fwdI], PASS_IDENTITY); fwdI = 1 - fwdI;
    hasAdvectedSinceBake = false;
  }

  function gpuStamp(isNewDrop) {
    if (isNewDrop && hasAdvectedSinceBake) {
      gpuBake();
    }
    gl.uniform1i(uIsNewDropLoc, isNewDrop ? 1 : 0);
    gl.uniform3f(
      uInkColor,
      (ink & 255) / 255,
      ((ink >> 8) & 255) / 255,
      ((ink >> 16) & 255) / 255
    );
    gl.uniform2f(uCenter, input.x, input.y);
    gl.uniform1f(uRadius, INK_RADIUS * dropSizeMult);
    drawTo(inkTex[1 - inkI], PASS_STAMP);
    inkI = 1 - inkI;
    input.stampX = input.x;
    input.stampY = input.y;
  }

  function seedInitialBath() {
    gpuClear();
    const drops = [
      [0.48, 0.50, 1.4],
      [0.48, 0.50, 1.2],
      [0.35, 0.38, 1.1],
      [0.35, 0.38, 0.9],
      [0.64, 0.62, 1.3],
      [0.64, 0.62, 1.0],
      [0.52, 0.48, 1.2],
      [0.52, 0.48, 0.95]
    ];
    const savedTool = activeTool;
    activeTool = 0;
    drops.forEach(([x, y, sz], idx) => {
      ink = hexToPack(dynamicPalette[idx % dynamicPalette.length][1]);
      input.x = x;
      input.y = y;
      dropSizeMult = sz;
      input.tap = true;
      for (let i = 0; i < 8; i++) {
        step(DT, DT);
      }
    });
    dropSizeMult = 1.0;
    ink = hexToPack(dynamicPalette[currentSwatchIndex][1]);

    activeTool = 1;
    input.down = true;
    const path = [
      [0.25, 0.30], [0.45, 0.28], [0.65, 0.45],
      [0.50, 0.60], [0.32, 0.72], [0.70, 0.75]
    ];
    for (let p = 0; p < path.length - 1; p++) {
      const [x0, y0] = path[p];
      const [x1, y1] = path[p + 1];
      for (let s = 0; s < 10; s++) {
        const t = s / 10;
        input.xPrev = input.x;
        input.yPrev = input.y;
        input.x = x0 + (x1 - x0) * t;
        input.y = y0 + (y1 - y0) * t;
        step(DT, DT);
      }
    }
    input.down = false;
    activeTool = savedTool;
    drawTo(null, PASS_DISPLAY);
  }

  function reset() {
    input.tap = false;
    gpuClear();
    drawTo(null, PASS_DISPLAY);
  }

  function step(dt, frameDelta) {
    const isActivelyWorking = input.down || input.tap;

    if (isActivelyWorking) {
      if (!isSpreading) {
        isSpreading = true;
      }
      if (activeTool === 0) {
        const radius = INK_RADIUS * dropSizeMult;
        const addedMass = (4.4 * dt + (input.tap ? 1.35 : 0)) * flowRateMult;
        gl.uniform1f(uMassLoc, addedMass);
        gl.uniform2f(uCenter, input.x, input.y);
        gl.uniform1f(uRadius, radius);
        drawTo(surfTex[1 - surfI], PASS_SPLAT);
        surfI = 1 - surfI;

        if (input.tap) {
          gpuStamp(true);
        } else {
          const movedDist = Math.hypot(input.x - input.stampX, input.y - input.stampY);
          if (movedDist > radius * 0.30) {
            gpuStamp(false);
          }
        }
      }
      input.tap = false;
    }

    if (!isSpreading) return false;

    const T = tension();
    const V = viscosity();
    gl.uniform1f(uSeqLoc, 0.042 / T);
    gl.uniform1f(uRateLoc, 10.5 * T / V);

    drawTo(mgRhs[0], PASS_SURF_RHS);
    gl.uniform1f(uScaleLoc, 0.85);
    drawTo(mgSol[0][0], PASS_WARM_START, phiTex.tex);
    const phiFinalIdx = solveMultigridVCycle(0.06, 2);
    const tmpPhi = phiTex;
    phiTex = mgSol[0][phiFinalIdx];
    mgSol[0][phiFinalIdx] = tmpPhi;

    if (vortValue > 1e-5) {
      drawTo(curlTex, PASS_VORTICITY);
    }

    gl.uniform1f(uDt, dt);
    gl.uniform1f(uFrameDtLoc, frameDelta);
    gl.uniform1f(uDampingLoc, ekmanDamping());
    gl.uniform1f(uViscDiffLoc, 0.15 + 0.35 * (1.0 - diffValue));
    gl.uniform1f(uVortConfLoc, vortValue * 8.5);

    gl.uniform1i(uTool, isActivelyWorking ? activeTool : 0);
    gl.uniform1f(uToolDragLoc, stylusDragMult);
    gl.uniform2f(uCenter, input.x, input.y);
    gl.uniform2f(uPrevCenter, input.xPrev, input.yPrev);
    gl.uniform2f(uRakeDir, input.dirX, input.dirY);
    gl.uniform2f(uPrevRakeDir, input.prevDirX, input.prevDirY);
    gl.uniform1f(uStickRadius, STICK_BASE_RADIUS * stylusRadiusMult);

    drawTo(inertVelTex[1 - inertI], PASS_ADVECT_INERTIAL);
    inertI = 1 - inertI;

    drawTo(mgRhs[0], PASS_NS_DIV);
    gl.uniform1f(uScaleLoc, 0.80);
    drawTo(mgSol[0][0], PASS_WARM_START, pressTex.tex);
    const pressFinalIdx = solveMultigridVCycle(0.0005, 1);
    const tmpPress = pressTex;
    pressTex = mgSol[0][pressFinalIdx];
    mgSol[0][pressFinalIdx] = tmpPress;

    drawTo(inertVelTex[1 - inertI], PASS_NS_PROJECT);
    inertI = 1 - inertI;

    drawTo(velTex, PASS_COMBINE_VEL);

    const sub = 3;
    const sdt = dt / sub;
    gl.uniform1f(uDt, sdt);
    for (let s = 0; s < sub; s++) {
      drawTo(surfTex[1 - surfI], PASS_ADVECT_SURF); surfI = 1 - surfI;
      drawTo(back[1 - backI], PASS_BACK); backI = 1 - backI;
      drawTo(fwd[1 - fwdI], PASS_FWD); fwdI = 1 - fwdI;
    }

    hasAdvectedSinceBake = true;
    stepCount++;
    if (stepCount % 750 === 0) gpuBake();

    pollAsyncGpuActivity(isActivelyWorking);

    return true;
  }

  function drawRing() {
    const w = ring.width;
    const h = ring.height;
    ringCtx.clearRect(0, 0, w, h);

    if (!(input.inside || input.down)) {
      toolCursor.classList.remove("visible", "pressing");
      return;
    }

    ringCtx.strokeStyle = "rgba(235, 225, 210, 0.65)";
    ringCtx.lineWidth = Math.max(1.2, w / 480);

    const radius = (activeTool === 0)
      ? 0.034 * Math.sqrt(0.72) * w * dropSizeMult
      : STICK_BASE_RADIUS * w * stylusRadiusMult;

    ringCtx.beginPath();
    ringCtx.arc(input.x * w, input.y * h, radius, 0, Math.PI * 2);
    ringCtx.stroke();

    // Position the skeuomorphic tool sprite so its tip hovers directly over the area circle center
    syncToolCursorImage();
    const [stageX, stageY] = stageFromWorld(input.x, input.y);
    toolCursor.style.left = `${stageX}px`;
    toolCursor.style.top = `${stageY}px`;
    toolCursor.classList.add("visible");
    toolCursor.classList.toggle("pressing", input.down);
  }

  function layout() {
    updateBathHomography();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const px = Math.round(RENDER_BATH_SIZE * dpr);
    if (view.width !== px || view.height !== px) {
      view.width = px;
      view.height = px;
      ring.width = px;
      ring.height = px;
    }
    drawTo(null, PASS_DISPLAY);
    drawRing();
  }

  // =========================================================
  // Color Picker: Preview while dragging, commit 1 color when closed
  // =========================================================
  const picker = document.getElementById("picker");
  const addColorBtn = document.getElementById("add-to-palette");
  const addColorPreview = document.getElementById("add-color-preview");
  let hasUncommittedColor = false;
  let pendingPickedHex = picker.value;

  function commitSingleNewColor(hex) {
    dynamicPalette.push(["Custom Ink", hex]);
    currentSwatchIndex = dynamicPalette.length - 1;
    renderPalette();
    const buttons = document.querySelectorAll(".swatch");
    if (buttons[currentSwatchIndex]) {
      selectPack(hexToPack(hex), buttons[currentSwatchIndex]);
    }
    hasUncommittedColor = false;
  }

  function flushPendingColorIfAny() {
    if (hasUncommittedColor) {
      commitSingleNewColor(pendingPickedHex);
    }
  }

  picker.addEventListener("input", () => {
    pendingPickedHex = picker.value;
    addColorPreview.style.background = pendingPickedHex;
    if (isIOSDevice) {
      // On iPadOS, input & change fire continuously while dragging; wait until dialog closes
      hasUncommittedColor = true;
    }
  });

  picker.addEventListener("change", () => {
    pendingPickedHex = picker.value;
    addColorPreview.style.background = pendingPickedHex;
    if (isIOSDevice) {
      hasUncommittedColor = true;
    } else {
      // On desktop browsers, change fires once when the color dialog closes
      commitSingleNewColor(pendingPickedHex);
    }
  });

  // When the iPad color popover closes, blur fires on the input
  picker.addEventListener("blur", () => {
    flushPendingColorIfAny();
  });

  // Also flush if the user taps anywhere outside the "+ Add Color" button
  document.addEventListener("pointerdown", (e) => {
    if (hasUncommittedColor && !addColorBtn.contains(e.target)) {
      flushPendingColorIfAny();
    }
  }, true);

  view.addEventListener("pointerdown", (e) => {
    flushPendingColorIfAny();
    view.setPointerCapture(e.pointerId);
    const p = worldFromEvent(e);
    input.x = p[0]; input.y = p[1];
    input.xPrev = p[0]; input.yPrev = p[1];
    input.vX = 0; input.vY = 0;
    input.prevDirX = input.dirX;
    input.prevDirY = input.dirY;
    input.down = true; input.tap = true; input.inside = true;
    pouredDrop = true;
    drawRing();
    e.preventDefault();
  });

  view.addEventListener("pointermove", (e) => {
    const p = worldFromEvent(e);
    input.x = p[0]; input.y = p[1];
    input.inside = true;
  });

  function cycleColor() {
    if (dynamicPalette.length === 0) return;
    currentSwatchIndex = (currentSwatchIndex + 1) % dynamicPalette.length;
    const buttons = document.querySelectorAll(".swatch");
    if (buttons[currentSwatchIndex]) buttons[currentSwatchIndex].click();
  }

  function endPointer(e) {
    input.down = false;
    if (pouredDrop) {
      if (sumiMode && activeTool === 0) cycleColor();
      pouredDrop = false;
    }
    if (e && e.pointerId !== undefined && view.hasPointerCapture(e.pointerId)) {
      view.releasePointerCapture(e.pointerId);
    }
    drawRing();
  }

  view.addEventListener("pointerup", endPointer);
  view.addEventListener("pointercancel", endPointer);
  view.addEventListener("pointerleave", () => {
    input.inside = false;
    if (!input.down) drawRing();
  });
  view.addEventListener("contextmenu", (e) => e.preventDefault());

  // =========================================================
  // Interactive Corner Calibration ('P' Key to Toggle, 'R' to Reset)
  // =========================================================
  let activePin = null;
  window.addEventListener("keydown", (e) => {
    if (e.key === "p" || e.key === "P") {
      document.querySelectorAll(".corner-pin").forEach(pin => pin.classList.toggle("visible"));
    } else if ((e.key === "r" || e.key === "R") && document.querySelector(".corner-pin.visible")) {
      bathQuad = DEFAULT_BATH_QUAD.map(pt => [pt[0], pt[1]]);
      localStorage.removeItem("suminagashi_bath_quad_v2");
      updateBathHomography();
    }
  });

  document.querySelectorAll(".corner-pin").forEach(pin => {
    pin.addEventListener("pointerdown", (e) => {
      pin.setPointerCapture(e.pointerId);
      activePin = parseInt(pin.getAttribute("data-corner"), 10);
      e.stopPropagation();
      e.preventDefault();
    });
    pin.addEventListener("pointermove", (e) => {
      if (activePin === null) return;
      const rect = stage.getBoundingClientRect();
      const nx = Math.max(0.05, Math.min(0.95, (e.clientX - rect.left) / rect.width));
      const ny = Math.max(0.05, Math.min(0.95, (e.clientY - rect.top) / rect.height));
      bathQuad[activePin] = [nx, ny];
      updateBathHomography();
    });
    pin.addEventListener("pointerup", (e) => {
      if (activePin !== null) {
        activePin = null;
        try {
          localStorage.setItem("suminagashi_bath_quad_v2", JSON.stringify(bathQuad));
        } catch (_) {}
        console.log("Updated BATH_QUAD:", JSON.stringify(bathQuad));
      }
      if (pin.hasPointerCapture(e.pointerId)) pin.releasePointerCapture(e.pointerId);
    });
  });

  // Tool Hotspot Selection (Brushes vs Bamboo Stick)
  document.querySelectorAll(".tool-hotspot").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tool-hotspot").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".top-view").forEach(p => p.classList.remove("active"));

      btn.classList.add("active");
      activeTool = parseInt(btn.getAttribute("data-tool"), 10);
      const panel = document.getElementById(`panel-${activeTool}`);
      if (panel) panel.classList.add("active");

      syncToolCursorImage();
      if (input.inside) drawRing();
    });
  });

  // Washi Paper Stack Export Menu Toggle
  const washiTrigger = document.getElementById("washi-trigger");
  const washiMenu = document.getElementById("washi-menu");
  washiTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    washiMenu.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!washiMenu.contains(e.target) && e.target !== washiTrigger) {
      washiMenu.classList.remove("open");
    }
  });

  function renderPalette() {
    const swatchBox = document.getElementById("swatches");
    swatchBox.innerHTML = "";
    dynamicPalette.forEach(([name, hex], index) => {
      const wrap = document.createElement("div");
      wrap.className = "swatch-wrap";

      const button = document.createElement("button");
      button.type = "button";
      button.className = "swatch";
      button.title = name;
      button.setAttribute("aria-label", name);
      button.style.background = hex;
      button.setAttribute("aria-pressed", currentSwatchIndex === index ? "true" : "false");
      button.addEventListener("click", () => {
        currentSwatchIndex = index;
        selectPack(hexToPack(hex), button);
      });

      wrap.appendChild(button);

      if (dynamicPalette.length > 1) {
        const del = document.createElement("div");
        del.className = "swatch-del";
        del.innerHTML = "&times;";
        del.title = "Remove ink";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          dynamicPalette.splice(index, 1);
          if (currentSwatchIndex >= dynamicPalette.length) {
            currentSwatchIndex = Math.max(0, dynamicPalette.length - 1);
          }
          renderPalette();
          const buttons = document.querySelectorAll(".swatch");
          if (buttons[currentSwatchIndex]) buttons[currentSwatchIndex].click();
        });
        wrap.appendChild(del);
      }

      swatchBox.appendChild(wrap);
    });
  }

  renderPalette();

  function selectPack(packed, el) {
    ink = packed;
    document.querySelectorAll(".swatch").forEach((node) => {
      node.setAttribute("aria-pressed", node === el ? "true" : "false");
    });
  }

  document.getElementById("sumi-mode").addEventListener("change", (e) => { sumiMode = e.target.checked; });

  const waterSwatchLabel = document.getElementById("water-swatch-label");
  document.getElementById("bath-color").addEventListener("input", (e) => {
    const hex = e.target.value;
    if (waterSwatchLabel) waterSwatchLabel.style.background = hex;
    const n = parseInt(hex.slice(1), 16);
    gl.useProgram(program);
    gl.uniform3f(uWater, ((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    reset();
  });

  document.getElementById("diffusion").addEventListener("input", (e) => {
    diffValue = parseFloat(e.target.value);
    document.getElementById("diffusion-read").textContent = Math.round(diffValue * 100) + "%";
  });

  document.getElementById("glide").addEventListener("input", (e) => {
    glideValue = parseFloat(e.target.value);
    document.getElementById("glide-read").textContent = Math.round(glideValue * 100) + "%";
  });

  document.getElementById("vorticity").addEventListener("input", (e) => {
    vortValue = parseFloat(e.target.value);
    document.getElementById("vorticity-read").textContent = Math.round(vortValue * 100) + "%";
  });

  document.getElementById("size").addEventListener("input", (e) => {
    dropSizeMult = parseFloat(e.target.value);
    document.getElementById("size-read").textContent = dropSizeMult.toFixed(1) + "x";
    if (input.inside) drawRing();
  });
  document.getElementById("flow").addEventListener("input", (e) => {
    flowRateMult = parseFloat(e.target.value);
    document.getElementById("flow-read").textContent = flowRateMult.toFixed(1) + "x";
  });

  document.getElementById("stick-size").addEventListener("input", (e) => {
    stylusRadiusMult = parseFloat(e.target.value);
    document.getElementById("stick-size-read").textContent = stylusRadiusMult.toFixed(1) + "x";
    if (input.inside) drawRing();
  });
  document.getElementById("stick-drag").addEventListener("input", (e) => {
    stylusDragMult = parseFloat(e.target.value);
    document.getElementById("stick-drag-read").textContent = stylusDragMult.toFixed(1) + "x";
  });

  document.getElementById("clear").addEventListener("click", reset);

  document.getElementById("export-jpg").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = exportHighRes("image/jpeg", false);
    a.download = "suminagashi.jpg";
    a.click();
    washiMenu.classList.remove("open");
  });

  document.getElementById("export-svg").addEventListener("click", () => {
    const exportSize = 4096;
    const data = exportHighRes("image/png", true);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${exportSize}" height="${exportSize}"><image href="${data}" width="${exportSize}" height="${exportSize}" /></svg>`;
    const blob = new Blob([svg], { type: "image/svg+xml" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "suminagashi.svg";
    a.click();
    washiMenu.classList.remove("open");
  });

  // Keep bath homography aligned across portrait load, iPad rotation, and visualViewport changes
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => {
    layout();
    setTimeout(layout, 120);
    setTimeout(layout, 360);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", layout);
    window.visualViewport.addEventListener("scroll", layout);
  }
  if (typeof ResizeObserver !== "undefined") {
    const stageObserver = new ResizeObserver(() => layout());
    stageObserver.observe(stage);
  }

  let last = performance.now();
  let acc = 0;

  function frame(now) {
    let delta = (now - last) / 1000;
    last = now;
    if (delta > 0.05) delta = 0.05;

    input.prevDirX = input.dirX;
    input.prevDirY = input.dirY;

    const dx = input.x - input.xPrev;
    const dy = input.y - input.yPrev;
    const dist = Math.hypot(dx, dy);

    if (input.down && delta > 1e-5) {
      input.vX = dx / delta;
      input.vY = dy / delta;
      if (dist > 0.0008) {
        const targetDirX = dx / dist;
        const targetDirY = dy / dist;
        const casterTurn = Math.min(1.0, dist / 0.032);
        input.dirX += (targetDirX - input.dirX) * casterTurn;
        input.dirY += (targetDirY - input.dirY) * casterTurn;
        const dLen = Math.hypot(input.dirX, input.dirY) || 1.0;
        input.dirX /= dLen;
        input.dirY /= dLen;
      }
    } else {
      input.vX = 0;
      input.vY = 0;
    }

    acc += delta;
    let steps = 0;
    let painted = false;
    while (acc >= DT && steps < 2) {
      if (step(DT, Math.max(delta, DT))) painted = true;
      input.xPrev = input.x;
      input.yPrev = input.y;
      input.prevDirX = input.dirX;
      input.prevDirY = input.dirY;
      acc -= DT;
      steps++;
    }
    if (steps === 2) acc = 0;

    if (painted) drawTo(null, PASS_DISPLAY);
    if (steps > 0 || input.inside || input.down) drawRing();
    requestAnimationFrame(frame);
  }

  layout();
  seedInitialBath();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
