<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>chromaSpill</title>
<style>
  :root {
    --bg-image: url("Suminagashi Ink Studio Interface.png");
    --ink-text: #282019;
    --muted-text: #5e5042;
    --ceramic: #e9e2d4;
    --accent: #a63420;
  }

  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background-color: #140e09;
    color: var(--ink-text);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
    overflow: hidden;
    touch-action: none;
  }

  /* =========================================================
     iPhone Blocker Overlay
     ========================================================= */
  .iphone-blocker {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 2rem;
    background-color: #140e09;
    z-index: 9999;
    text-align: center;
  }

  .iphone-blocker.active {
    display: grid;
  }

  .iphone-blocker-card {
    background-color: #d6cbb8;
    background-image:
      radial-gradient(circle at 20% 25%, rgba(246, 240, 228, 0.7), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(175, 158, 134, 0.45), transparent 60%);
    color: var(--ink-text);
    border: 1px solid rgba(55, 42, 28, 0.65);
    border-radius: 10px;
    padding: 1.75rem 1.5rem;
    max-width: 22rem;
    box-shadow:
      inset 0 0 18px rgba(68, 50, 32, 0.38),
      0 16px 40px rgba(0, 0, 0, 0.75);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.5;
  }

  /* =========================================================
     16:9 Aspect-Ratio Locked Stage Mapped to the Mockup Image
     ========================================================= */
  .studio-stage {
    position: fixed;
    inset: 0;
    margin: auto;
    width: min(100vw, calc(100vh * (16 / 9)));
    height: min(100vh, calc(100vw * (9 / 16)));
    width: min(100dvw, calc(100dvh * (16 / 9)));
    height: min(100dvh, calc(100dvw * (9 / 16)));
    background-image: var(--bg-image);
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    container-type: size;
    overflow: hidden;
  }

  /* =========================================================
     Aged Parchment Card Overlays (Left Control Board)
     ========================================================= */
  .parchment-card {
    position: absolute;
    background-color: #d6cbb8;
    background-image:
      radial-gradient(circle at 20% 25%, rgba(246, 240, 228, 0.7), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(175, 158, 134, 0.45), transparent 60%),
      repeating-linear-gradient(0deg, rgba(60, 45, 30, 0.025) 0px, rgba(60, 45, 30, 0.025) 1px, transparent 1px, transparent 3px);
    border-radius: 0.45cqw;
    border: 1px solid rgba(55, 42, 28, 0.55);
    box-shadow:
      inset 0 0 1.4cqw rgba(68, 50, 32, 0.42),
      inset 0 1px 0 rgba(255, 250, 240, 0.5),
      0 0.25cqw 0.6cqw rgba(0, 0, 0, 0.45);
    padding: 1.1cqw 1.35cqw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
  }

  .top-slot {
    left: 6.25%;
    top: 7.75%;
    width: 20.8%;
    height: 27.6%;
  }

  .bath-slot {
    left: 5.85%;
    top: 58.6%;
    width: 21.05%;
    height: 31.5%;
  }

  .top-view {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }

  .top-view.active {
    display: flex;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(75, 58, 40, 0.35);
    padding-bottom: 0.35cqw;
    margin-bottom: 0.3cqw;
    flex-shrink: 0;
  }

  .header-title-group {
    display: flex;
    align-items: center;
    gap: 0.6cqw;
  }

  .header-right-group {
    display: flex;
    align-items: center;
    gap: 0.45cqw;
  }

  .section-header h2 {
    margin: 0;
    font-size: 0.95cqw;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-text);
    font-weight: 700;
  }

  .mini-hanko {
    display: inline-grid;
    place-items: center;
    width: 1.35cqw;
    height: 1.35cqw;
    border: 1.5px solid #9e2a1b;
    border-radius: 2px;
    color: #9e2a1b;
    font-size: 0.8cqw;
    font-weight: 700;
    line-height: 1;
    opacity: 0.85;
  }

  .cycle-toggle {
    font-size: 0.72cqw;
    color: var(--muted-text);
    display: flex;
    align-items: center;
    gap: 0.3cqw;
    cursor: pointer;
    font-family: system-ui, sans-serif;
    font-weight: 600;
  }

  .cycle-toggle input {
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
    width: 0.85cqw;
    height: 0.85cqw;
  }

  /* Ceramic Ink Dishes */
  .colors {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.55cqw;
    max-height: 4.8cqw;
    overflow-y: auto;
    padding: 0.2cqw 0.15cqw;
  }

  .swatches-list {
    display: contents;
  }

  .swatch-wrap {
    position: relative;
    display: flex;
    justify-content: center;
  }

  .swatch {
    width: 2.1cqw;
    height: 2.1cqw;
    border-radius: 50%;
    border: 0.22cqw solid var(--ceramic);
    padding: 0;
    cursor: pointer;
    position: relative;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
    box-shadow:
      0 0.2cqw 0.45cqw rgba(25, 18, 12, 0.45),
      inset 0 2px 4px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(60, 45, 30, 0.35);
  }

  .swatch:hover {
    transform: translateY(-1px) scale(1.06);
  }

  .swatch[aria-pressed="true"] {
    box-shadow:
      0 0.25cqw 0.6cqw rgba(166, 52, 32, 0.45),
      inset 0 2px 4px rgba(0, 0, 0, 0.5),
      0 0 0 2px var(--accent);
    transform: scale(1.08);
  }

  .swatch-del {
    position: absolute;
    top: -0.25cqw;
    right: -0.25cqw;
    width: 0.95cqw;
    height: 0.95cqw;
    background: #f5efe6;
    color: #5c4b3c;
    border: 1px solid rgba(0,0,0,0.3);
    border-radius: 50%;
    font-size: 0.65cqw;
    line-height: 0.85cqw;
    text-align: center;
    cursor: pointer;
    display: none;
    font-family: sans-serif;
  }

  .swatch-wrap:hover .swatch-del {
    display: block;
  }

  .btn-add-color,
  .btn-float-image {
    position: relative;
    border-radius: 0.25cqw;
    border: 1px solid rgba(75, 58, 40, 0.45);
    background: rgba(238, 230, 214, 0.78);
    color: var(--ink-text);
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  .btn-add-color {
    width: 2.05cqw;
    height: 2.05cqw;
    font-size: 1.15cqw;
    line-height: 1;
    flex-shrink: 0;
  }

  .btn-float-image {
    height: 1.65cqw;
    padding: 0 0.55cqw;
    font-size: 0.72cqw;
    letter-spacing: 0.04em;
    gap: 0.35cqw;
  }

  .btn-add-color:hover,
  .btn-float-image:hover {
    background: rgba(248, 242, 230, 0.96);
    border-color: rgba(75, 58, 40, 0.7);
  }

  .btn-add-color:active,
  .btn-float-image:active {
    transform: scale(0.96);
  }

  .btn-add-color input[type="color"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    border: 0;
    padding: 0;
  }

  /* =========================================================
     Skeuomorphic Recessed Groove & Brass Knob Sliders
     ========================================================= */
  .compact-sliders {
    display: flex;
    flex-direction: column;
    gap: 0.55cqw;
    padding-top: 0.4cqw;
    border-top: 1px solid rgba(75, 58, 40, 0.2);
  }

  .stick-sliders-wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    flex: 1;
    padding: 0.4cqw 0;
  }

  /* Bamboo Stick: Stir / Pins segmented toggle */
  .mode-toggle {
    display: flex;
    border: 1px solid rgba(75, 58, 40, 0.55);
    border-radius: 0.25cqw;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
  }

  .mode-toggle button {
    font-family: inherit;
    font-size: 0.61cqw;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 0.18cqw 0.42cqw;
    background: rgba(238, 230, 214, 0.78);
    color: var(--ink-text);
    border: 0;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .mode-toggle button + button {
    border-left: 1px solid rgba(75, 58, 40, 0.45);
  }

  .mode-toggle button:hover {
    background: rgba(248, 242, 230, 0.96);
  }

  .mode-toggle button.active {
    background: linear-gradient(180deg, #5e2418, #3d160e);
    color: #f3e9d8;
  }

  .mode-toggle button.active:hover {
    background: linear-gradient(180deg, #6e2b1d, #4a1b12);
  }

  .mode-toggle button.active + button.active {
    border-left-color: rgba(243, 233, 216, 0.38);
  }

  /* Pin / slingshot controls (visible in Pins mode only) */
  .pin-controls {
    display: none;
    flex-direction: column;
    gap: 0.3cqw;
    padding-top: 0.35cqw;
    border-top: 1px solid rgba(75, 58, 40, 0.2);
  }

  .pin-controls.active {
    display: flex;
  }

  .pin-hint {
    margin: 0;
    font-size: 0.6cqw;
    font-style: italic;
    color: var(--muted-text);
    text-align: center;
  }

  .pin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4cqw;
  }

  .pin-row-actions {
    display: flex;
    align-items: center;
    gap: 0.4cqw;
  }

  .pin-count {
    font-size: 0.72cqw;
    font-weight: 600;
    color: var(--muted-text);
    white-space: nowrap;
  }

  .btn-float-image.btn-fire {
    background: linear-gradient(180deg, #9e311d, #782212);
    color: #f7efe2;
    border-color: #4f1409;
  }

  .btn-float-image.btn-fire:hover {
    background: linear-gradient(180deg, #b33822, #8c2815);
  }

  .btn-float-image.btn-fire:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
  }

  .grid-dropdown-wrap {
    position: relative;
    display: inline-block;
  }

  .grid-menu {
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    gap: 0.25cqw;
    background: #dfd5c3;
    padding: 0.35cqw;
    border-radius: 0.3cqw;
    border: 1px solid rgba(60, 45, 30, 0.6);
    box-shadow: 0 0.8cqw 1.8cqw rgba(0, 0, 0, 0.65);
    min-width: 6.8cqw;
    z-index: 50;
  }

  .grid-menu.open {
    display: flex;
  }

  .grid-menu button {
    background: #efe7d8;
    border: 1px solid rgba(90, 70, 50, 0.4);
    color: var(--ink-text);
    padding: 0.28cqw 0.5cqw;
    font-family: inherit;
    font-size: 0.68cqw;
    font-weight: 700;
    border-radius: 0.2cqw;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }

  .grid-menu button:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .bath-controls-list {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex: 1;
    padding-top: 0.2cqw;
  }

  label.craft-slider {
    display: flex;
    flex-direction: column;
    gap: 0.35cqw;
  }

  .craft-slider-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.84cqw;
    color: var(--ink-text);
    font-weight: 600;
  }

  .craft-slider-header strong {
    font-size: 0.82cqw;
    color: var(--ink-text);
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  .craft-slider input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 0.55cqw;
    background: linear-gradient(180deg, #4d4032 0%, #7d6d5b 60%, #968673 100%);
    border-radius: 999px;
    border: 1px solid rgba(40, 30, 20, 0.65);
    box-shadow:
      inset 0 1px 3px rgba(0, 0, 0, 0.75),
      0 1px 0 rgba(255, 250, 240, 0.45);
    cursor: pointer;
    outline: none;
    margin: 0.15cqw 0;
  }

  .craft-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 1.45cqw;
    height: 1.45cqw;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0cf85 0%, #bd8d42 48%, #7d5720 85%, #593c12 100%);
    border: 1px solid rgba(50, 32, 12, 0.85);
    box-shadow:
      0 0.22cqw 0.4cqw rgba(0, 0, 0, 0.65),
      inset 0 1px 2px rgba(255, 242, 204, 0.75);
    cursor: grab;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  .craft-slider input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
    filter: brightness(1.08);
  }

  .craft-slider input[type="range"]::-webkit-slider-thumb:active {
    cursor: grabbing;
    transform: scale(0.96);
  }

  .craft-slider input[type="range"]::-moz-range-thumb {
    width: 1.45cqw;
    height: 1.45cqw;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0cf85 0%, #bd8d42 48%, #7d5720 85%, #593c12 100%);
    border: 1px solid rgba(50, 32, 12, 0.85);
    box-shadow:
      0 0.22cqw 0.4cqw rgba(0, 0, 0, 0.65),
      inset 0 1px 2px rgba(255, 242, 204, 0.75);
    cursor: grab;
  }

  .water-color-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.84cqw;
    font-weight: 600;
    color: var(--ink-text);
  }

  .water-row-actions {
    display: flex;
    align-items: center;
    gap: 0.5cqw;
  }

  .water-swatch-btn {
    width: 1.85cqw;
    height: 1.85cqw;
    border-radius: 50%;
    border: 0.18cqw solid #cbbda8;
    box-shadow:
      0 0.15cqw 0.35cqw rgba(0, 0, 0, 0.5),
      inset 0 1px 3px rgba(0, 0, 0, 0.4),
      0 0 0 1px rgba(45, 32, 20, 0.65);
    overflow: hidden;
    cursor: pointer;
    background: #b8b0a2;
    padding: 0;
    flex-shrink: 0;
  }

  .water-swatch-btn input {
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    border: 0;
    padding: 0;
  }

  /* =========================================================
     Middle Tool Rack Hotspots
     ========================================================= */
  .tool-hotspot {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    z-index: 15;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    transition: filter 0.2s ease, transform 0.2s ease;
  }

  .tool-hotspot[data-tool="0"] {
    left: 8.8%;
    top: 37%;
    width: 7.6%;
    height: 19.6%;
  }

  .tool-hotspot[data-tool="1"] {
    left: 17.2%;
    top: 37%;
    width: 7.2%;
    height: 19.6%;
  }

  .tool-hotspot:hover .plaque-label {
    filter: brightness(1.12);
    transform: translateY(-1px);
  }

  .plaque-label {
    width: 82%;
    height: 20%;
    border-radius: 0.25cqw;
    display: grid;
    place-items: center;
    font-size: 0.68cqw;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #d7cec0, #b8ad9c);
    color: #2b221a;
    border: 1px solid rgba(40, 30, 20, 0.65);
    box-shadow:
      0 0.2cqw 0.45cqw rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: all 0.2s ease;
  }

  .tool-hotspot.active .plaque-label {
    background: linear-gradient(180deg, #5e2418, #3d160e);
    color: #f3e9d8;
    border-color: #a84630;
    box-shadow:
      0 0.25cqw 0.55cqw rgba(0, 0, 0, 0.75),
      0 0 0.6cqw rgba(184, 66, 42, 0.45),
      inset 0 1px 0 rgba(255, 190, 160, 0.35);
  }

  /* =========================================================
     Projective Homography Water Bath (Alpha-Feathered Meniscus)
     ========================================================= */
  .bath {
    position: absolute;
    left: 0;
    top: 0;
    width: 400px;
    height: 400px;
    transform-origin: 0 0;
    background: transparent;
    cursor: none;
    touch-action: none;
    z-index: 5;
  }

  .bath canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: transparent;
  }

  #ring { pointer-events: none; }

  /* =========================================================
     Floating Skeuomorphic Tool Cursor (brush.png & stick.png)
     ========================================================= */
  .tool-cursor {
    position: absolute;
    left: 0;
    top: 0;
    width: 9.5cqw;
    height: 9.5cqw;
    object-fit: contain;
    pointer-events: none;
    z-index: 25;
    opacity: 0;
    transform-origin: 7.5% 91%;
    transform: translate(-7.5%, -91%);
    filter: drop-shadow(0.35cqw 0.55cqw 0.45cqw rgba(0, 0, 0, 0.55));
    transition: opacity 0.12s ease, transform 0.08s ease;
    will-change: left, top, transform;
  }

  .tool-cursor.visible {
    opacity: 1;
  }

  .tool-cursor.pressing {
    transform: translate(-7.5%, -91%) scale(0.95) rotate(-3deg);
    filter: drop-shadow(0.18cqw 0.28cqw 0.25cqw rgba(0, 0, 0, 0.65));
  }

  /* =========================================================
     Interactive Corner Calibration Pins (Toggle with 'P' key)
     ========================================================= */
  .corner-pin {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff2c2, #d49b35 60%, #6e4411 100%);
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    cursor: move;
    z-index: 50;
    display: none;
  }

  .corner-pin.visible {
    display: block;
  }

  .corner-pin::after {
    content: attr(data-label);
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 14, 9, 0.88);
    color: #f5ead8;
    font-family: monospace;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* =========================================================
     Right Side Interactive Hotspots (Washi Stack & Fresh Water)
     ========================================================= */
  .washi-hotspot-wrap {
    position: absolute;
    left: 80.6%;
    top: 5.5%;
    width: 13.6%;
    height: 30.8%;
    z-index: 20;
  }

  .washi-hotspot {
    width: 100%;
    height: 100%;
    background: transparent;
    border: 2px solid transparent;
    border-radius: 4px;
    transform: rotate(-5.5deg);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .washi-hotspot:hover {
    transform: rotate(-4deg) scale(1.02);
    border-color: rgba(235, 215, 185, 0.55);
    box-shadow: 0 0.6cqw 1.5cqw rgba(0, 0, 0, 0.45);
  }

  .washi-export-menu {
    position: absolute;
    top: 102%;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    gap: 0.4cqw;
    background: #dfd5c3;
    padding: 0.55cqw;
    border-radius: 0.3cqw;
    border: 1px solid rgba(60, 45, 30, 0.6);
    box-shadow: 0 0.8cqw 1.8cqw rgba(0, 0, 0, 0.65);
    width: 9.5cqw;
    z-index: 30;
  }

  .washi-export-menu.open {
    display: flex;
  }

  .washi-btn {
    background: #efe7d8;
    border: 1px solid rgba(90, 70, 50, 0.4);
    color: var(--ink-text);
    padding: 0.45cqw 0.5cqw;
    font-family: inherit;
    font-size: 0.75cqw;
    font-weight: 700;
    border-radius: 0.2cqw;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, color 0.15s;
  }

  .washi-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .water-cup-hotspot {
    position: absolute;
    left: 83.4%;
    top: 72.3%;
    width: 9.6%;
    height: 18.8%;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 20;
    border-radius: 0.5cqw;
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .water-cup-hotspot::before {
    content: "";
    position: absolute;
    left: 8%;
    top: 2%;
    width: 84%;
    height: 70%;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .water-cup-hotspot:hover::before {
    border-color: rgba(200, 230, 245, 0.65);
    box-shadow: 0 0 1.2cqw rgba(160, 210, 230, 0.45);
  }

  .water-cup-hotspot:active {
    transform: scale(0.96);
  }

  /* =========================================================
     Square Image Crop Modal Overlay
     ========================================================= */
  .crop-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(14, 10, 7, 0.76);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    place-items: center;
    z-index: 100;
  }

  .crop-modal-backdrop.open {
    display: grid;
  }

  .crop-modal-card {
    width: 31cqw;
    background-color: #d6cbb8;
    background-image:
      radial-gradient(circle at 20% 25%, rgba(246, 240, 228, 0.72), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(175, 158, 134, 0.45), transparent 60%),
      repeating-linear-gradient(0deg, rgba(60, 45, 30, 0.025) 0px, rgba(60, 45, 30, 0.025) 1px, transparent 1px, transparent 3px);
    border-radius: 0.55cqw;
    border: 1px solid rgba(55, 42, 28, 0.75);
    box-shadow:
      inset 0 0 1.6cqw rgba(68, 50, 32, 0.42),
      inset 0 1px 0 rgba(255, 250, 240, 0.55),
      0 1.4cqw 3.8cqw rgba(0, 0, 0, 0.82);
    padding: 1.25cqw 1.45cqw;
    display: flex;
    flex-direction: column;
    gap: 0.85cqw;
  }

  .crop-viewport-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 0.35cqw;
    overflow: hidden;
    border: 2px solid rgba(48, 36, 24, 0.75);
    box-shadow:
      inset 0 0 1.2cqw rgba(0, 0, 0, 0.65),
      0 1px 0 rgba(255, 250, 240, 0.55);
    background: #1c1814;
    cursor: grab;
    touch-action: none;
  }

  .crop-viewport-wrap:active {
    cursor: grabbing;
  }

  .crop-viewport-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .crop-grid-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255, 248, 235, 0.22) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 248, 235, 0.22) 1px, transparent 1px);
    background-size: 33.333% 33.333%;
    box-shadow: inset 0 0 0 1px rgba(255, 248, 235, 0.25);
  }

  .crop-hint {
    font-size: 0.72cqw;
    color: var(--muted-text);
    text-align: center;
    margin: -0.25cqw 0 0;
    font-style: italic;
  }

  .crop-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.6cqw;
    padding-top: 0.25cqw;
    border-top: 1px solid rgba(75, 58, 40, 0.25);
  }

  .crop-btn {
    flex: 1;
    height: 2.1cqw;
    border-radius: 0.28cqw;
    font-family: inherit;
    font-size: 0.78cqw;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }

  .crop-btn:active {
    transform: scale(0.98);
  }

  .crop-btn-secondary {
    background: rgba(238, 230, 214, 0.8);
    color: var(--ink-text);
    border: 1px solid rgba(75, 58, 40, 0.45);
  }

  .crop-btn-secondary:hover {
    background: rgba(248, 242, 230, 0.98);
  }

  .crop-btn-primary {
    background: linear-gradient(180deg, #9e311d, #782212);
    color: #f7efe2;
    border: 1px solid #4f1409;
    box-shadow:
      0 0.2cqw 0.45cqw rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 195, 170, 0.35);
  }

  .crop-btn-primary:hover {
    background: linear-gradient(180deg, #b33822, #8c2815);
  }

  /* =========================================================
     Full-Screen Mode & Docked Hoverable Parameter Windows
     ========================================================= */
  .btn-icon-only {
    width: 1.65cqw;
    padding: 0;
    flex-shrink: 0;
  }

  .btn-icon-only svg {
    width: 0.92cqw;
    height: 0.92cqw;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn-icon-only .fs-icon-compress {
    display: none;
  }

  .studio-stage.fullscreen-mode .btn-icon-only .fs-icon-expand {
    display: none;
  }

  .studio-stage.fullscreen-mode .btn-icon-only .fs-icon-compress {
    display: block;
  }

  .dock-tab {
    display: none;
  }

  .fs-only-label {
    display: none;
  }

  .fs-corner-exit {
    display: none;
  }

  .studio-stage.fullscreen-mode {
    width: 100vw;
    height: 100vh;
    width: 100dvw;
    height: 100dvh;
    background-image: none;
    background-color: #14100d;
    box-shadow: none;
  }

  /* Left Docked Hoverable Parchment Windows (Same Core Top/Middle/Bottom Layout) */
  .studio-stage.fullscreen-mode .parchment-card {
    overflow: visible;
    width: clamp(276px, 21.5cqmax, 365px);
    padding: 1.05cqmax 1.3cqmax;
    border-radius: 0.45cqmax;
    z-index: 35;
    box-shadow:
      inset 0 0 1.4cqmax rgba(68, 50, 32, 0.42),
      inset 0 1px 0 rgba(255, 250, 240, 0.5),
      0 10px 30px rgba(0, 0, 0, 0.72);
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }

  .studio-stage.fullscreen-mode .top-slot {
    left: 0;
    top: max(12px, env(safe-area-inset-top, 12px));
    height: clamp(210px, 28cqmax, 310px);
    transform: translateX(calc(-100% + 6px));
  }

  .studio-stage.fullscreen-mode .bath-slot {
    left: 0;
    top: auto;
    bottom: max(12px, env(safe-area-inset-bottom, 12px));
    height: clamp(230px, 31.5cqmax, 340px);
    transform: translateX(calc(-100% + 6px));
  }

  @media (hover: hover) and (pointer: fine) {
    .studio-stage.fullscreen-mode .top-slot:hover,
    .studio-stage.fullscreen-mode .bath-slot:hover {
      transform: translateX(max(12px, env(safe-area-inset-left, 12px)));
    }
  }

  .studio-stage.fullscreen-mode .top-slot.dock-open,
  .studio-stage.fullscreen-mode .bath-slot.dock-open {
    transform: translateX(max(12px, env(safe-area-inset-left, 12px)));
  }

  /* Protruding Parchment Handle Tabs on Docked Windows */
  .studio-stage.fullscreen-mode .dock-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    padding: 12px 4px;
    background-color: #d6cbb8;
    background-image: linear-gradient(90deg, #c6b9a3, #dfd4c2);
    border: 1px solid rgba(55, 42, 28, 0.75);
    border-left: none;
    border-radius: 0 7px 7px 0;
    box-shadow: 4px 3px 12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 250, 240, 0.55);
    color: var(--ink-text);
    font-family: inherit;
    cursor: pointer;
    z-index: 2;
  }

  .studio-stage.fullscreen-mode .dock-tab-kanji {
    font-size: 12px;
    font-weight: 700;
    color: #9e2a1b;
    line-height: 1;
  }

  .studio-stage.fullscreen-mode .dock-tab-text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-text);
  }

  /* Middle-Left Tool Selector Plaques in Fullscreen */
  .studio-stage.fullscreen-mode .tool-hotspot {
    left: max(10px, env(safe-area-inset-left, 10px));
    width: auto;
    height: auto;
    z-index: 34;
    opacity: 0.82;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .studio-stage.fullscreen-mode .tool-hotspot:hover,
  .studio-stage.fullscreen-mode .tool-hotspot.active {
    opacity: 1;
  }

  .studio-stage.fullscreen-mode .tool-hotspot[data-tool="0"] {
    top: calc(50% - 34px);
  }

  .studio-stage.fullscreen-mode .tool-hotspot[data-tool="1"] {
    top: calc(50% + 4px);
  }

  .studio-stage.fullscreen-mode .plaque-label {
    width: auto;
    height: auto;
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 11px;
  }

  /* Right-Side Docked Print & Clear Plaques + Quick Exit Fullscreen Button */
  .studio-stage.fullscreen-mode .washi-hotspot-wrap {
    left: auto;
    right: max(12px, env(safe-area-inset-right, 12px));
    top: max(12px, env(safe-area-inset-top, 12px));
    width: auto;
    height: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 36;
  }

  .studio-stage.fullscreen-mode .washi-hotspot {
    width: auto;
    height: 32px;
    padding: 0 12px;
    transform: none;
    background: rgba(214, 203, 184, 0.9);
    border: 1px solid rgba(55, 42, 28, 0.72);
    border-radius: 6px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 250, 240, 0.55);
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-text);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.82;
  }

  .studio-stage.fullscreen-mode .washi-hotspot:hover {
    transform: translateY(-1px);
    opacity: 1;
    background: rgba(235, 226, 210, 0.98);
  }

  .studio-stage.fullscreen-mode .washi-export-menu {
    left: auto;
    right: 0;
    transform: none;
    top: calc(100% + 6px);
    width: max(150px, 10cqmax);
    padding: 8px;
    gap: 6px;
    border-radius: 6px;
  }

  .studio-stage.fullscreen-mode .washi-btn {
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 4px;
  }

  .studio-stage.fullscreen-mode .fs-only-label {
    display: inline;
  }

  .studio-stage.fullscreen-mode .fs-corner-exit {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 6px;
    background: rgba(214, 203, 184, 0.9);
    border: 1px solid rgba(55, 42, 28, 0.72);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 250, 240, 0.55);
    color: var(--ink-text);
    cursor: pointer;
    opacity: 0.82;
    transition: opacity 0.15s, background 0.15s;
  }

  .studio-stage.fullscreen-mode .fs-corner-exit:hover {
    opacity: 1;
    background: rgba(235, 226, 210, 0.98);
  }

  .studio-stage.fullscreen-mode .fs-corner-exit svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .studio-stage.fullscreen-mode .water-cup-hotspot {
    left: auto;
    right: max(12px, env(safe-area-inset-right, 12px));
    top: auto;
    bottom: max(12px, env(safe-area-inset-bottom, 12px));
    width: auto;
    height: 32px;
    padding: 0 12px;
    background: rgba(214, 203, 184, 0.9);
    border: 1px solid rgba(55, 42, 28, 0.72);
    border-radius: 6px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 250, 240, 0.55);
    color: var(--ink-text);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 34;
    opacity: 0.82;
  }

  .studio-stage.fullscreen-mode .water-cup-hotspot::before {
    display: none;
  }

  .studio-stage.fullscreen-mode .water-cup-hotspot:hover {
    opacity: 1;
    background: rgba(235, 226, 210, 0.98);
  }

  /* Keep card inner typography & touch controls comfortable in portrait iPad fullscreen */
  .studio-stage.fullscreen-mode .section-header h2 { font-size: max(12px, 0.95cqmax); }
  .studio-stage.fullscreen-mode .craft-slider-header,
  .studio-stage.fullscreen-mode .water-color-row { font-size: max(11.5px, 0.84cqmax); }
  .studio-stage.fullscreen-mode .craft-slider-header strong { font-size: max(11px, 0.82cqmax); }
  .studio-stage.fullscreen-mode .btn-float-image {
    height: max(24px, 1.65cqmax);
    padding: 0 max(8px, 0.55cqmax);
    font-size: max(10.5px, 0.72cqmax);
  }
  .studio-stage.fullscreen-mode .btn-icon-only {
    width: max(24px, 1.65cqmax);
    padding: 0;
  }
  .studio-stage.fullscreen-mode .btn-icon-only svg {
    width: max(13px, 0.92cqmax);
    height: max(13px, 0.92cqmax);
  }
  .studio-stage.fullscreen-mode .swatch {
    width: max(26px, 2.05cqmax);
    height: max(26px, 2.05cqmax);
  }
  .studio-stage.fullscreen-mode .btn-add-color {
    width: max(26px, 2.0cqmax);
    height: max(26px, 2.0cqmax);
    font-size: max(15px, 1.15cqmax);
  }
  .studio-stage.fullscreen-mode .water-swatch-btn {
    width: max(24px, 1.85cqmax);
    height: max(24px, 1.85cqmax);
  }
  .studio-stage.fullscreen-mode .mode-toggle button {
    font-size: max(9.5px, 0.61cqmax);
    padding: max(3px, 0.18cqmax) max(6px, 0.42cqmax);
  }
  .studio-stage.fullscreen-mode .cycle-toggle,
  .studio-stage.fullscreen-mode .pin-count {
    font-size: max(10.5px, 0.72cqmax);
  }
  .studio-stage.fullscreen-mode .craft-slider input[type="range"] {
    height: max(7px, 0.55cqmax);
  }
  .studio-stage.fullscreen-mode .craft-slider input[type="range"]::-webkit-slider-thumb {
    width: max(18px, 1.4cqmax);
    height: max(18px, 1.4cqmax);
  }
  .studio-stage.fullscreen-mode .grid-menu button {
    font-size: max(11px, 0.7cqmax);
    padding: max(5px, 0.3cqmax) max(8px, 0.5cqmax);
  }
  .studio-stage.fullscreen-mode .crop-modal-card {
    width: min(88vw, 480px);
    max-height: 92dvh;
    padding: 18px 20px;
    gap: 12px;
    border-radius: 8px;
  }
  .studio-stage.fullscreen-mode .crop-viewport-wrap {
    max-height: 54dvh;
    width: auto;
    max-width: 100%;
    margin: 0 auto;
  }
  .studio-stage.fullscreen-mode .crop-hint {
    font-size: 12px;
  }
  .studio-stage.fullscreen-mode .crop-btn {
    height: 34px;
    font-size: 12px;
    border-radius: 5px;
  }
  .studio-stage.fullscreen-mode .tool-cursor {
    width: 9.5cqmax;
    height: 9.5cqmax;
  }
</style>
</head>
<body>

<!-- Shown only when an iPhone is detected -->
<div class="iphone-blocker" id="iphone-blocker" role="alert">
  <div class="iphone-blocker-card">
    This is designed for large screens
  </div>
</div>

<div class="studio-stage" id="studio-stage">

  <!-- 1. TOP CARD OVERLAY: Sumi Inks (Tool 0) OR Bamboo Stick (Tool 1) -->
  <div class="parchment-card top-slot" id="top-dock-card">
    <button class="dock-tab" id="top-dock-tab" type="button" title="Hover or tap for Tool Parameters">
      <span class="dock-tab-kanji">墨</span>
      <span class="dock-tab-text" id="top-dock-tab-text">Stick</span>
    </button>
    <!-- View 0: Sumi Ink Palette + Brush Sliders -->
    <div class="top-view" id="panel-0">
      <div>
        <div class="section-header">
          <div class="header-title-group">
            <h2>Sumi Inks</h2>
          </div>
          <div class="header-right-group">
            <div class="mode-toggle" role="group" aria-label="Ink mode">
              <button type="button" class="active" data-ink-mode="drop" aria-pressed="true" title="Drop and pour ink directly onto the bath">Drop</button>
              <button type="button" data-ink-mode="push" aria-pressed="false" title="Toggle Push with Drop: hold & drag to pour fluid while pushing pin, touch anywhere to relocate">Push</button>
            </div>
            <label class="cycle-toggle" title="Automatically alternate ink dishes on each drop">
              <input type="checkbox" id="sumi-mode" checked> Auto
            </label>
            <span class="mini-hanko">墨</span>
          </div>
        </div>

        <div class="colors">
          <div class="swatches-list" id="swatches"></div>
          <label class="btn-add-color" id="add-to-palette" title="Add custom ink color">
            <span aria-hidden="true">+</span>
            <input id="picker" type="color" value="#1d4e89" aria-label="Add custom ink color">
          </label>
        </div>
      </div>

      <div class="compact-sliders" id="brush-sliders">
        <label class="craft-slider">
          <div class="craft-slider-header">
            <span>Drop Size</span>
            <strong id="size-read">1.0x</strong>
          </div>
          <input id="size" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
        </label>
        <label class="craft-slider" id="pour-slider-wrap">
          <div class="craft-slider-header">
            <span>Pour Rate</span>
            <strong id="flow-read">1.0x</strong>
          </div>
          <input id="flow" type="range" min="0.1" max="5.0" step="0.1" value="1.0">
        </label>
      </div>

      <div class="pin-controls" id="ink-pin-controls">
        <div class="pin-row">
          <span class="pin-count" id="ink-pin-count">1 push pin</span>
          <div class="pin-row-actions">
            <div class="grid-dropdown-wrap">
              <button class="btn-float-image btn-grid" id="ink-grid-btn" type="button" title="Place symmetric grid of push pins">Grid &blacktriangledown;</button>
              <div class="grid-menu" id="ink-grid-menu">
                <button type="button" data-grid-tool="ink" data-grid="1pin">1 Pin (Center)</button>
                <button type="button" data-grid-tool="ink" data-grid="2x2">2 &times; 2 (4)</button>
                <button type="button" data-grid-tool="ink" data-grid="3x3">3 &times; 3 (9)</button>
                <button type="button" data-grid-tool="ink" data-grid="4x4">4 &times; 4 (16)</button>
                <button type="button" data-grid-tool="ink" data-grid="ring6">Ring (6)</button>
                <button type="button" data-grid-tool="ink" data-grid="ring8">Ring (8)</button>
                <button type="button" data-grid-tool="ink" data-grid="cross">Cross (5)</button>
              </div>
            </div>
            <button class="btn-float-image" id="ink-pin-clear" type="button" title="Clear push pins (Delete)">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <!-- View 1: Bamboo Stick Parameters -->
    <div class="top-view active" id="panel-1">
      <div class="section-header">
        <h2>Bamboo Stick</h2>
        <div class="header-right-group">
          <div class="mode-toggle" role="group" aria-label="Stick mode">
            <button type="button" class="active" data-stick-mode="stir" aria-pressed="true" title="Stir the bath directly with the stick">Stir</button>
            <button type="button" data-stick-mode="pins" aria-pressed="false" title="Place pins, aim slingshots, then sweep or release">Pins</button>
          </div>
          <span class="mini-hanko">墨</span>
        </div>
      </div>

      <div class="stick-sliders-wrap">
        <label class="craft-slider">
          <div class="craft-slider-header">
            <span>Tip Thickness</span>
            <strong id="stick-size-read">1.0x</strong>
          </div>
          <input id="stick-size" type="range" min="0.2" max="4.0" step="0.1" value="1.0">
        </label>
        <label class="craft-slider">
          <div class="craft-slider-header">
            <span>Stir Force</span>
            <strong id="stick-drag-read">1.0x</strong>
          </div>
          <input id="stick-drag" type="range" min="0.1" max="5.0" step="0.1" value="1.0">
        </label>
      </div>

      <div class="pin-controls" id="pin-controls">
        <p class="pin-hint">Tap: pin &bull; Drag pin back: slingshot &bull; Drag water: sweep</p>
        <div class="pin-row">
          <span class="pin-count" id="pin-count">No pins</span>
          <div class="pin-row-actions">
            <div class="grid-dropdown-wrap">
              <button class="btn-float-image btn-grid" id="stick-grid-btn" type="button" title="Place symmetric grid of stick pins">Grid &blacktriangledown;</button>
              <div class="grid-menu" id="stick-grid-menu">
                <button type="button" data-grid-tool="stick" data-grid="1pin">1 Pin (Center)</button>
                <button type="button" data-grid-tool="stick" data-grid="2x2">2 &times; 2 (4)</button>

<script>
(function () {
  "use strict";

  // Prevent Apple Pencil / touch long-press text selection and callouts globally
  document.addEventListener("selectstart", (e) => e.preventDefault());
  document.addEventListener("dragstart", (e) => e.preventDefault());

  // Detect iPhone (including iOS Safari with "Request Desktop Website" enabled)
  function isIPhoneDetected() {
    const ua = navigator.userAgent || "";
    const platform = navigator.platform || "";
    if (/iPhone|iPod/i.test(ua) || /iPhone|iPod/i.test(platform)) return true;
    const isTouchMac = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
    const minScreenDim = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    if (isTouchMac && minScreenDim < 600) return true;
    return false;
  }

  const stage = document.getElementById("studio-stage");
  const iphoneBlocker = document.getElementById("iphone-blocker");

  if (isIPhoneDetected()) {
    stage.style.display = "none";
    iphoneBlocker.classList.add("active");
    return;
  }

  // Since iPhones are filtered above, iOS / touch-Mac here specifically identifies iPad
  const isIOSDevice = /iPad|iPhone|iPod/i.test(navigator.userAgent || "") ||
    (/Macintosh/i.test(navigator.userAgent || "") && navigator.maxTouchPoints > 1);

  const BASE_SIM = 512;
  const MG_LEVELS = 6;
  const BASE_INK = 2048;
  const BASE_MAP = 1024;
  const ENERGY_RES = 8;
  const DT = 1 / 60;
  const RENDER_BATH_SIZE = 800;

  let simW = BASE_SIM;
  let simH = BASE_SIM;
  let mapW = BASE_MAP;
  let mapH = BASE_MAP;
  let inkW = BASE_INK;
  let inkH = BASE_INK;
  let domainX = 1.0;
  let domainY = 1.0;
  // Default to opening directly in Full Screen mode on iPad
  let isFullScreenMode = isIOSDevice;
  if (isFullScreenMode) {
    stage.classList.add("fullscreen-mode");
  }

  // Normalized stage coordinates [x, y] for the 4 corners of the inner water surface:
  // Order: Top-Left (TL), Top-Right (TR), Bottom-Right (BR), Bottom-Left (BL)
  const DEFAULT_BATH_QUAD = [
    [0.3255, 0.1140], // TL: nested into top-left inner shadow crease
    [0.77, 0.1145],   // TR: nested into top-right inner shadow crease
    [0.798, 0.856],  // BR: meets the bottom-right meniscus crease
    [0.314, 0.858]  // BL: meets the bottom-left meniscus crease
  ];

  let bathQuad = DEFAULT_BATH_QUAD.map(pt => [pt[0], pt[1]]);
  try {
    const saved = localStorage.getItem("suminagashi_bath_quad_v2");
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length === 4) bathQuad = parsed;
    }
  } catch (_) {}

  // Forward and inverse homography matrices between stage pixels (x, y) and UV [0, 1]^2
  let fwdHomography = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  let invHomography = [1, 0, 0, 0, 1, 0, 0, 0, 1];

  let dynamicPalette = [
    ["Sumi Black", "#161514"],
    ["Aged Washi", "#b8b0a2"]
  ];

  const input = {
    x: 0.5, y: 0.5,
    xPrev: 0.5, yPrev: 0.5,
    stampX: 0.5, stampY: 0.5,
    vX: 0.0, vY: 0.0,
    dirX: 1.0, dirY: 0.0,
    prevDirX: 1.0, prevDirY: 0.0,
    down: false, tap: false, inside: false
  };

  let ink = hexToPack(dynamicPalette[0][1]);
  let stepCount = 0;
  let isSpreading = false;
  let pouredDrop = false;
  let hasAdvectedSinceBake = false;

  const INK_RADIUS = 0.034 * 0.72;
  const STICK_BASE_RADIUS = 0.015;

  let activeTool = 1;
  let sumiMode = true;
  let currentSwatchIndex = 0;

  let diffValue = 0.68;
  let glideValue = 0.34;
  let vortValue = 1.0;

  let dropSizeMult = 1.0;
  let flowRateMult = 1.0;

  let stylusRadiusMult = 1.0;
  let stylusDragMult = 1.0;

  const bath = document.getElementById("bath");
  const view = document.getElementById("view");
  const ring = document.getElementById("ring");
  const ringCtx = ring.getContext("2d");
  const toolCursor = document.getElementById("tool-cursor");

  // alpha: true + premultipliedAlpha: false allows PASS_DISPLAY to feather edges/corners smoothly
  const gl = view.getContext("webgl2", {
    alpha: true,
    premultipliedAlpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    preserveDrawingBuffer: true
  });
  if (!gl) throw new Error("WebGL2 is required to draw the bath.");

  if (!gl.getExtension("EXT_color_buffer_float")) {
    throw new Error("This browser cannot keep floating-point fluid textures on the GPU.");
  }

  function pack(r, g, b) { return (r & 255) | ((g & 255) << 8) | ((b & 255) << 16); }
  function hexToPack(hex) {
    const n = parseInt(hex.slice(1), 16);
    return pack((n >> 16) & 255, (n >> 8) & 255, n & 255);
  }

  function tension() { return 0.35 + (diffValue * 2.15); }
  function viscosity() { return 2.4 - (diffValue * 1.9); }
  // Reversed viscosity behavior: 0% flows freely (low damping), 100% is thick fluid (high damping)
  function ekmanDamping() {
    return 0.35 + Math.pow(glideValue, 2.0) * 6.5;
  }

  // =========================================================
  // 2D Projective Homography (CSS matrix3d + Inverse Unprojection)
  // =========================================================
  function updateBathHomography() {
    const rect = stage.getBoundingClientRect();
    const W = rect.width;
    const H = rect.height;
    if (W < 10 || H < 10) return;

    if (isFullScreenMode) {
      bath.style.width = `${W}px`;
      bath.style.height = `${H}px`;
      bath.style.transform = "none";
      fwdHomography = [W, 0, 0, 0, H, 0, 0, 0, 1];
      invHomography = [1 / W, 0, 0, 0, 1 / H, 0, 0, 0, 1];
      return;
    }

    // Keep bath local CSS box strictly smaller than stage height so WebKit never clips before matrix3d
    const S = Math.max(64, Math.round(Math.min(W, H) * 0.75));
    bath.style.width = `${S}px`;
    bath.style.height = `${S}px`;

    const x0 = bathQuad[0][0] * W, y0 = bathQuad[0][1] * H;
    const x1 = bathQuad[1][0] * W, y1 = bathQuad[1][1] * H;
    const x2 = bathQuad[2][0] * W, y2 = bathQuad[2][1] * H;
    const x3 = bathQuad[3][0] * W, y3 = bathQuad[3][1] * H;

    const dx1 = x1 - x2, dx2 = x3 - x2, sx = x0 - x1 + x2 - x3;
    const dy1 = y1 - y2, dy2 = y3 - y2, sy = y0 - y1 + y2 - y3;
    const det = dx1 * dy2 - dx2 * dy1 || 1e-9;

    const g = (sx * dy2 - dx2 * sy) / det;
    const h = (dx1 * sy - sx * dy1) / det;

    const a = x1 - x0 + g * x1;
    const b = x3 - x0 + h * x3;
    const c = x0;
    const d = y1 - y0 + g * y1;
    const e = y3 - y0 + h * y3;
    const f = y0;

    fwdHomography = [a, b, c, d, e, f, g, h, 1];

    // Adjugate of H_unit for mapping stage pixel (x, y) back to UV [0, 1]^2
    invHomography = [
      e - f * h, c * h - b, b * f - c * e,
      f * g - d, a - c * g, c * d - a * f,
      d * h - e * g, b * g - a * h, a * e - b * d
    ];

    const m3d = [
      a / S, d / S, 0, g / S,
      b / S, e / S, 0, h / S,
      0,     0,     1, 0,
      c,     f,     0, 1
    ];
    bath.style.transform = `matrix3d(${m3d.join(",")})`;

    document.querySelectorAll(".corner-pin").forEach(pin => {
      const idx = parseInt(pin.getAttribute("data-corner"), 10);
      pin.style.left = (bathQuad[idx][0] * 100).toFixed(2) + "%";
      pin.style.top = (bathQuad[idx][1] * 100).toFixed(2) + "%";
      pin.setAttribute(
        "data-label",
        `${["TL", "TR", "BR", "BL"][idx]} (${(bathQuad[idx][0] * 100).toFixed(1)}%, ${(bathQuad[idx][1] * 100).toFixed(1)}%)`
      );
    });
  }

  function worldFromEvent(e) {
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const M = invHomography;
    const w = M[6] * x + M[7] * y + M[8] || 1e-9;
    const u = (M[0] * x + M[1] * y + M[2]) / w;
    const v = (M[3] * x + M[4] * y + M[5]) / w;
    return [Math.max(0, Math.min(1, u)), Math.max(0, Math.min(1, v))];
  }

  function stageFromWorld(u, v) {
    const H = fwdHomography;
    const w = H[6] * u + H[7] * v + H[8] || 1e-9;
    return [
      (H[0] * u + H[1] * v + H[2]) / w,
      (H[3] * u + H[4] * v + H[5]) / w
    ];
  }

  function syncToolCursorImage() {
    const targetSrc = activeTool === 0 ? "brush.png" : "stick.png";
    if (toolCursor.getAttribute("src") !== targetSrc) {
      toolCursor.setAttribute("src", targetSrc);
    }
    if (activeTool === 0) {
      toolCursor.style.transformOrigin = "7.2% 90.2%";
    } else {
      toolCursor.style.transformOrigin = "7.8% 92.2%";
    }
  }

  const VERT = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

  const FRAG = `#version 300 es
precision highp float;
precision highp int;

uniform sampler2D uInk;
uniform sampler2D uMap;
uniform sampler2D uForward;
uniform sampler2D uVel;
uniform sampler2D uSurf;
uniform sampler2D uPhi;
uniform sampler2D uInertVel;
uniform sampler2D uPress;
uniform sampler2D uCurl;
uniform sampler2D uAuxA;
uniform sampler2D uAuxB;

uniform vec2 uSimSize;
uniform vec2 uMapSize;
uniform vec2 uInkSize;
uniform vec2 uTargetSize;
uniform vec2 uDomain;
uniform float uDt;
uniform float uRadius;
uniform vec2 uCenter;
uniform vec2 uPrevCenter;
uniform vec3 uInkColor;
uniform vec3 uWater;
uniform int uPass;
uniform int uIsNewDrop;

uniform float uMass;
uniform float uSeq;
uniform float uRate;

uniform int uTool;
uniform float uToolDrag;
uniform vec2 uRakeDir;
uniform vec2 uPrevRakeDir;
uniform float uStickRadius;

uniform float uAlpha;
uniform float uScale;
uniform float uDamping;
uniform float uViscDiff;
uniform float uVortConf;
uniform float uFrameDt;
uniform int uIsExport;
uniform int uIsFullScreen;
uniform vec2 uOldInkSize;
uniform vec2 uResizeScale;

// Pin / Slingshot mode: up to MAX_PINS moving tine segments per step.
// uPinSeg[i] = (prev.xy, cur.xy), uPinVel[i] = physical tine velocity.
#define MAX_PINS 32
uniform int uPinCount;
uniform vec4 uPinSeg[MAX_PINS];
uniform vec2 uPinVel[MAX_PINS];

in vec2 vUv;
out vec4 fragColor;

float catmull(int k, float t) {
  if (k == 0) return t * (-0.5 + t * (1.0 - 0.5 * t));
  if (k == 1) return 1.0 + t * t * (-2.5 + 1.5 * t);
  if (k == 2) return t * (0.5 + t * (2.0 - 1.5 * t));
  return t * t * (-0.5 + 0.5 * t);
}

vec2 mapFetch(sampler2D tex, int x, int y) {
  ivec2 last = ivec2(uMapSize) - ivec2(1);
  return texelFetch(tex, clamp(ivec2(x, y), ivec2(0), last), 0).rg;
}

vec2 bicubic(sampler2D tex, vec2 uv) {
  vec2 p = clamp(uv, vec2(0.0), vec2(1.0)) * uMapSize - 0.5;
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  vec2 sum = vec2(0.0);
  for (int j = 0; j < 4; j++) {
    float wy = catmull(j, f.y);
    vec2 row = vec2(0.0);
    for (int k = 0; k < 4; k++) {
      row += mapFetch(tex, i.x - 1 + k, i.y - 1 + j) * catmull(k, f.x);
    }
    sum += row * wy;
  }
  return clamp(sum, vec2(0.0), vec2(1.0));
}

// Monotonicity-clamped Catmull-Rom prevents numerical diffusion of curved flow-map
// filaments during rapid low-viscosity spinning while remaining 100% overshoot-free.
vec2 mapBicubicClamped(sampler2D tex, vec2 uv) {
  vec2 p = clamp(uv, vec2(0.0), vec2(1.0)) * uMapSize - 0.5;
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  vec2 sum = vec2(0.0);
  for (int j = 0; j < 4; j++) {
    float wy = catmull(j, f.y);
    vec2 row = vec2(0.0);
    for (int k = 0; k < 4; k++) {
      row += mapFetch(tex, i.x - 1 + k, i.y - 1 + j) * catmull(k, f.x);
    }
    sum += row * wy;
  }
  vec2 a = mapFetch(tex, i.x, i.y);
  vec2 b = mapFetch(tex, i.x + 1, i.y);
  vec2 c = mapFetch(tex, i.x, i.y + 1);
  vec2 d = mapFetch(tex, i.x + 1, i.y + 1);
  vec2 lo = min(min(a, b), min(c, d));
  vec2 hi = max(max(a, b), max(c, d));
  return clamp(sum, lo, hi);
}

vec2 mapBilinear(sampler2D tex, vec2 uv) {
  vec2 p = clamp(uv, vec2(0.0), vec2(1.0)) * uMapSize - 0.5;
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  ivec2 last = ivec2(uMapSize) - ivec2(1);
  vec2 a = texelFetch(tex, clamp(i, ivec2(0), last), 0).rg;
  vec2 b = texelFetch(tex, clamp(i + ivec2(1, 0), ivec2(0), last), 0).rg;
  vec2 c = texelFetch(tex, clamp(i + ivec2(0, 1), ivec2(0), last), 0).rg;
  vec2 d = texelFetch(tex, clamp(i + ivec2(1, 1), ivec2(0), last), 0).rg;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float distAtSize(sampler2D tex, vec2 origin, vec2 texSize) {
  vec2 p = clamp(origin, vec2(0.0), vec2(1.0)) * texSize - 0.5;
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  ivec2 last = ivec2(texSize) - ivec2(1);
  float a = texelFetch(tex, clamp(i, ivec2(0), last), 0).a;
  float b = texelFetch(tex, clamp(i + ivec2(1, 0), ivec2(0), last), 0).a;
  float c = texelFetch(tex, clamp(i + ivec2(0, 1), ivec2(0), last), 0).a;
  float d = texelFetch(tex, clamp(i + ivec2(1, 1), ivec2(0), last), 0).a;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float distAt(vec2 origin) {
  return distAtSize(uInk, origin, uInkSize);
}

float distBicubicClampedSize(sampler2D tex, vec2 origin, vec2 texSize) {
  vec2 p = clamp(origin, vec2(0.0), vec2(1.0)) * texSize - 0.5;
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  ivec2 last = ivec2(texSize) - ivec2(1);
  float sum = 0.0;
  for (int j = 0; j < 4; j++) {
    float wy = catmull(j, f.y);
    float row = 0.0;
    for (int k = 0; k < 4; k++) {
      ivec2 c = clamp(i + ivec2(k - 1, j - 1), ivec2(0), last);
      row += texelFetch(tex, c, 0).a * catmull(k, f.x);
    }
    sum += row * wy;
  }
  float a = texelFetch(tex, clamp(i, ivec2(0), last), 0).a;
  float b = texelFetch(tex, clamp(i + ivec2(1, 0), ivec2(0), last), 0).a;
  float c = texelFetch(tex, clamp(i + ivec2(0, 1), ivec2(0), last), 0).a;
  float d = texelFetch(tex, clamp(i + ivec2(1, 1), ivec2(0), last), 0).a;
  float minD = min(min(a, b), min(c, d));
  float maxD = max(max(a, b), max(c, d));
  return clamp(sum, minD, maxD);
}

float distBicubicClamped(vec2 origin) {
  return distBicubicClampedSize(uInk, origin, uInkSize);
}

// Sign-masked bilinear sampling keeps level-set ink boundaries razor-sharp
// while smoothly interpolating continuous-tone uploaded images.
vec3 pureColorAtSize(sampler2D tex, vec2 origin, float targetSign, vec2 texSize) {
  vec2 p = clamp(origin, vec2(0.0), vec2(1.0)) * texSize - 0.5;
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  ivec2 last = ivec2(texSize) - ivec2(1);
  vec4 s00 = texelFetch(tex, clamp(i, ivec2(0), last), 0);
  vec4 s10 = texelFetch(tex, clamp(i + ivec2(1, 0), ivec2(0), last), 0);
  vec4 s01 = texelFetch(tex, clamp(i + ivec2(0, 1), ivec2(0), last), 0);
  vec4 s11 = texelFetch(tex, clamp(i + ivec2(1, 1), ivec2(0), last), 0);

  float w00 = (1.0 - f.x) * (1.0 - f.y);
  float w10 = f.x * (1.0 - f.y);
  float w01 = (1.0 - f.x) * f.y;
  float w11 = f.x * f.y;

  bool wantPos = (targetSign >= 0.0);
  vec3 colorSum = vec3(0.0);
  float weightSum = 0.0;

  if ((s00.a >= 0.0) == wantPos) { colorSum += s00.rgb * w00; weightSum += w00; }
  if ((s10.a >= 0.0) == wantPos) { colorSum += s10.rgb * w10; weightSum += w10; }
  if ((s01.a >= 0.0) == wantPos) { colorSum += s01.rgb * w01; weightSum += w01; }
  if ((s11.a >= 0.0) == wantPos) { colorSum += s11.rgb * w11; weightSum += w11; }

  if (weightSum > 1e-5) {
    return colorSum / weightSum;
  }
  return s00.rgb * w00 + s10.rgb * w10 + s01.rgb * w01 + s11.rgb * w11;
}

vec3 pureColorAt(vec2 origin, float targetSign) {
  return pureColorAtSize(uInk, origin, targetSign, uInkSize);
}

vec2 simBilinearRG(sampler2D tex, vec2 world) {
  vec2 p = clamp(world * uSimSize - 0.5, vec2(0.0), uSimSize - 1.0);
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  ivec2 last = ivec2(uSimSize) - ivec2(1);
  vec2 a = texelFetch(tex, clamp(i, ivec2(0), last), 0).rg;
  vec2 b = texelFetch(tex, clamp(i + ivec2(1, 0), ivec2(0), last), 0).rg;
  vec2 c = texelFetch(tex, clamp(i + ivec2(0, 1), ivec2(0), last), 0).rg;
  vec2 d = texelFetch(tex, clamp(i + ivec2(1, 1), ivec2(0), last), 0).rg;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float coarseBilinearR(sampler2D tex, vec2 uv, vec2 coarseSize) {
  vec2 p = clamp(uv * coarseSize - 0.5, vec2(0.0), coarseSize - 1.0);
  ivec2 i = ivec2(floor(p));
  vec2 f = p - vec2(i);
  ivec2 last = ivec2(coarseSize) - ivec2(1);
  float a = texelFetch(tex, clamp(i, ivec2(0), last), 0).r;
  float b = texelFetch(tex, clamp(i + ivec2(1, 0), ivec2(0), last), 0).r;
  float c = texelFetch(tex, clamp(i + ivec2(0, 1), ivec2(0), last), 0).r;
  float d = texelFetch(tex, clamp(i + ivec2(1, 1), ivec2(0), last), 0).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// 4th-order Runge-Kutta backward & forward characteristic tracing in physical domain
vec2 rk4Back(vec2 uv, float dt) {
  vec2 invDom = 1.0 / uDomain;
  vec2 k1 = simBilinearRG(uVel, uv) * invDom;
  vec2 k2 = simBilinearRG(uVel, clamp(uv - 0.5 * dt * k1, vec2(0.0), vec2(1.0))) * invDom;
  vec2 k3 = simBilinearRG(uVel, clamp(uv - 0.5 * dt * k2, vec2(0.0), vec2(1.0))) * invDom;
  vec2 k4 = simBilinearRG(uVel, clamp(uv - dt * k3, vec2(0.0), vec2(1.0))) * invDom;
  return clamp(uv - (dt / 6.0) * (k1 + 2.0 * k2 + 2.0 * k3 + k4), vec2(0.0), vec2(1.0));
}

vec2 rk4Fwd(vec2 uv, float dt) {
  vec2 invDom = 1.0 / uDomain;
  vec2 k1 = simBilinearRG(uVel, uv) * invDom;
  vec2 k2 = simBilinearRG(uVel, clamp(uv + 0.5 * dt * k1, vec2(0.0), vec2(1.0))) * invDom;
  vec2 k3 = simBilinearRG(uVel, clamp(uv + 0.5 * dt * k2, vec2(0.0), vec2(1.0))) * invDom;
  vec2 k4 = simBilinearRG(uVel, clamp(uv + dt * k3, vec2(0.0), vec2(1.0))) * invDom;
  return clamp(uv + (dt / 6.0) * (k1 + 2.0 * k2 + 2.0 * k3 + k4), vec2(0.0), vec2(1.0));
}

// Shared bamboo-tine forcing in isotropic physical coordinates (uv * uDomain)
vec2 applyTine(vec2 w, vec2 uv, vec2 a, vec2 b, vec2 tineVel, float R) {
  float R2 = R * R;
  vec2 uvP = uv * uDomain;
  vec2 aP = a * uDomain;
  vec2 bP = b * uDomain;
  vec2 ab = bP - aP;
  float ab2 = dot(ab, ab);
  float t = ab2 > 1e-8 ? clamp(dot(uvP - aP, ab) / ab2, 0.0, 1.0) : 1.0;
  vec2 closest = aP + t * ab;
  vec2 r = uvP - closest;
  float d2 = dot(r, r);

  if (d2 < R2 * 9.0) {
    float speed = length(tineVel);
    if (speed > 3.2) tineVel *= 3.2 / speed;

    float core = exp(-d2 / (R2 * 1.15));
    w = mix(w, tineVel * 0.68, clamp(core * 0.85, 0.0, 0.92));

    float E = exp(-d2 / (R2 * 1.6));
    float crossProd = tineVel.x * r.y - tineVel.y * r.x;
    vec2 dipole = E * vec2(
      tineVel.x - 1.5 * r.y * crossProd / R2,
      tineVel.y + 1.5 * r.x * crossProd / R2
    );
    w += dipole * uDt * 3.5;
  }
  return w;
}

void main() {
  if (uPass == 0) {
    vec2 world = vec2(vUv.x, 1.0 - vUv.y);
    vec2 origin = bicubic(uMap, world);
    float d = distAt(origin);
    vec3 c = pureColorAt(origin, d);
    float fw = max(fwidth(d), 1e-5);
    vec2 g = vec2(dFdx(d), dFdy(d));
    float pixels = abs(d) / fw;
    vec2 pixelStep = g * (-d / max(dot(g, g), 1e-8));
    vec2 worldStep = pixelStep.x * dFdx(world) + pixelStep.y * dFdy(world);
    vec2 otherOrigin = bicubic(uMap, world + 2.0 * worldStep);
    vec3 other = pureColorAt(otherOrigin, -d);

    float keep = (uIsExport == 1) ? 1.0 : (pixels >= 1.0 ? 1.0 : 0.5 + 0.5 * pixels);
    vec3 baseCol = mix(other, c, keep);

    // Full-bleed unshadowed output when pulling JPG/SVG prints
    if (uIsExport == 1) {
      fragColor = vec4(baseCol, 1.0);
      return;
    }

    // Edge-to-edge full-screen bath mode (subtle bezel vignette + studio window sheen)
    if (uIsFullScreen == 1) {
      float sideVig = smoothstep(0.0, 0.018, min(world.x, 1.0 - world.x))
                    * smoothstep(0.0, 0.018, min(world.y, 1.0 - world.y));
      float rimFactor = 0.72 + 0.28 * sideVig;
      vec3 darkBezel = vec3(0.065, 0.052, 0.042);
      vec3 fsShaded = mix(darkBezel, baseCol, rimFactor);
      float fsSheen = exp(-length((world - vec2(0.76, 0.18)) * vec2(1.4, 2.2)) * 3.2) * 0.055 * sideVig;
      fsShaded += vec3(0.95, 0.92, 0.86) * fsSheen;
      fragColor = vec4(fsShaded, 1.0);
      return;
    }

    // Rounded-box signed distance for curved meniscus corners (wider rounding at BL & BR)
    vec2 halfSize = vec2(0.5);
    vec2 p = world - halfSize;
    float rCorner = mix(0.024, 0.042, smoothstep(-0.1, 0.25, p.y));
    vec2 q = abs(p) - (halfSize - vec2(rCorner));
    float boxDist = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - rCorner;

    // inwardDist is 0 on the rounded meniscus boundary and positive inside the bath
    float inwardDist = max(0.0, -boxDist);

    // Smooth alpha feathering across the outer rim and rounded bottom corners
    float edgeAlpha = smoothstep(0.0, 0.026, inwardDist);

    // Directional wall & corner ambient occlusion so bright water grades into the wet wood shadow
      float topShadow = smoothstep(0.0, 0.095, world.y);
      float botShadow = smoothstep(0.0, 0.075, 1.0 - world.y);
      float sideShadow = smoothstep(0.0, 0.055, min(world.x, 1.0 - world.x));
      float cornerAO = smoothstep(0.0, 0.055, inwardDist);

      float wallFactor = (0.28 + 0.72 * topShadow)
                       * (0.12 + 0.88 * botShadow)
                       * (0.30 + 0.70 * sideShadow)
                       * (0.05 + 0.95 * cornerAO);

      vec3 darkMeniscus = vec3(0.065, 0.052, 0.042);
      vec3 shaded = mix(darkMeniscus, baseCol, clamp(wallFactor, 0.0, 1.0));

      // Studio window sheen (masked by wallFactor so it never brightens the shadowed wood crease)
      float windowSheen = exp(-length((world - vec2(0.76, 0.18)) * vec2(1.4, 2.2)) * 3.2) * 0.07 * wallFactor;

      shaded += vec3(0.95, 0.92, 0.86) * windowSheen;

      fragColor = vec4(shaded, edgeAlpha);
  }
  else if (uPass == 1) {
    vec2 world = gl_FragCoord.xy / uTargetSize;
    vec2 prev = rk4Back(world, uDt);
    fragColor = vec4(mapBicubicClamped(uMap, prev), 0.0, 1.0);
  }
  else if (uPass == 2) {
    vec2 origin = gl_FragCoord.xy / uTargetSize;
    vec2 world = mapBilinear(uForward, origin);
    fragColor = vec4(rk4Fwd(world, uDt), 0.0, 1.0);
  }
  else if (uPass == 3) {
    fragColor = vec4(gl_FragCoord.xy / uTargetSize, 0.0, 1.0);
  }
  else if (uPass == 4) {
    vec2 world = gl_FragCoord.xy / uTargetSize;
    vec2 origin = bicubic(uMap, world);
    float d = distBicubicClamped(origin);
    vec3 c = pureColorAt(origin, d);
    fragColor = vec4(c, d);
  }
  else if (uPass == 5) {
    vec2 origin = gl_FragCoord.xy / uTargetSize;
    vec2 placed = mapBilinear(uForward, origin);
    float radial = length((placed - uCenter) * uDomain) - uRadius;

    ivec2 coord = ivec2(gl_FragCoord.xy);
    vec4 old = texelFetch(uInk, coord, 0);

    vec2 centerOrigin = bicubic(uMap, uCenter);
    float centerD = distAt(centerOrigin);
    vec3 centerColor = pureColorAt(centerOrigin, centerD);
    bool sameColorAsCenter = (distance(centerColor, uInkColor) < 0.005) && (abs(centerD) < 0.99);

    // Always choose a level-set sign that keeps our own ink's sign when pouring onto
    // same-color ink, and strictly contrasts (-sign) when pouring onto water or another ink
    // (including when low-viscosity swirling sweeps background fluid under uCenter mid-pour).
    float targetSign = sameColorAsCenter
      ? (centerD >= 0.0 ? 1.0 : -1.0)
      : (centerD >= 0.0 ? -1.0 : 1.0);

    if (uIsNewDrop == 1 && !sameColorAsCenter) {
      if (radial <= 0.0) {
        fragColor = vec4(uInkColor, targetSign * (-radial));
      } else {
        float sgn = old.a >= 0.0 ? 1.0 : -1.0;
        fragColor = vec4(old.rgb, sgn * min(abs(old.a), radial));
      }
    } else {
      bool oldMatchesDrop = (distance(old.rgb, uInkColor) < 0.005) && ((old.a >= 0.0) == (targetSign >= 0.0));
      if (radial <= 0.0) {
        float dIn = oldMatchesDrop ? max(abs(old.a), -radial) : (-radial);
        fragColor = vec4(uInkColor, targetSign * dIn);
      } else {
        if (oldMatchesDrop) {
          fragColor = old;
        } else {
          float sgn = old.a >= 0.0 ? 1.0 : -1.0;
          fragColor = vec4(old.rgb, sgn * min(abs(old.a), radial));
        }
      }
    }
  }
  else if (uPass == 6) {
    fragColor = vec4(uWater, 1.0);
  }
  else if (uPass == 7) {
    vec2 origin = gl_FragCoord.xy / uTargetSize;
    float d = length((origin - uCenter) * uDomain);
    vec2 surf = texelFetch(uSurf, ivec2(gl_FragCoord.xy), 0).rg;
    if (d < uRadius) {
      float ker = cos(d / uRadius * 1.57079632679);
      float k2 = ker * ker;
      surf.r = min(surf.r + uMass * k2, 14.0);
      surf.g = mix(surf.g, 0.0, k2 * 0.65);
    }
    fragColor = vec4(surf, 0.0, 1.0);
  }
  else if (uPass == 8) {
    vec2 uv = gl_FragCoord.xy / uTargetSize;
    vec2 prev = rk4Back(uv, uDt);
    vec2 surf = simBilinearRG(uSurf, prev);

    ivec2 coord = ivec2(gl_FragCoord.xy);
    ivec2 last = ivec2(uTargetSize) - ivec2(1);
    vec2 h = uDomain / uTargetSize;
    float uL = coord.x == 0 ? 0.0 : texelFetch(uVel, coord - ivec2(1, 0), 0).x;
    float uR = coord.x == last.x ? 0.0 : texelFetch(uVel, coord + ivec2(1, 0), 0).x;
    float vB = coord.y == 0 ? 0.0 : texelFetch(uVel, coord - ivec2(0, 1), 0).y;
    float vT = coord.y == last.y ? 0.0 : texelFetch(uVel, coord + ivec2(0, 1), 0).y;

    float div = (uR - uL) / (2.0 * h.x) + (vT - vB) / (2.0 * h.y);
    float factor = exp(clamp(-div * uDt, -1.2, 1.2));
    float newS = clamp(surf.r * factor, 0.0, 14.0);
    float newAge = clamp(surf.g + 0.045 * uDt, 0.0, 1.0);
    fragColor = vec4(newS, newAge, 0.0, 1.0);
  }
  else if (uPass == 9) {
    ivec2 coord = ivec2(gl_FragCoord.xy);
    ivec2 last = ivec2(uTargetSize) - ivec2(1);
    float s = 0.0;
    float age = 0.0;
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        vec2 sc = texelFetch(uSurf, clamp(coord + ivec2(i, j), ivec2(0), last), 0).rg;
        s += sc.r;
        age += sc.g;
      }
    }
    s /= 9.0;
    age /= 9.0;
    float mobility = 1.0 - 0.35 * age;
    float excess = max(0.0, s - uSeq);
    float rhs = min(uRate * mobility * excess, 14.0);
    fragColor = vec4(2.0 * rhs, 0.0, 0.0, 1.0);
  }
  else if (uPass == 10) {
    ivec2 coord = ivec2(gl_FragCoord.xy);
    ivec2 last = ivec2(uTargetSize) - ivec2(1);
    vec2 h = uDomain / uTargetSize;
    float invHx2 = 1.0 / (h.x * h.x);
    float invHy2 = 1.0 / (h.y * h.y);

    float uC = texelFetch(uAuxA, coord, 0).r;
    float uL = coord.x == 0 ? uC : texelFetch(uAuxA, coord - ivec2(1, 0), 0).r;
    float uR = coord.x == last.x ? uC : texelFetch(uAuxA, coord + ivec2(1, 0), 0).r;
    float uB = coord.y == 0 ? uC : texelFetch(uAuxA, coord - ivec2(0, 1), 0).r;
    float uT = coord.y == last.y ? uC : texelFetch(uAuxA, coord + ivec2(0, 1), 0).r;
    float fC = texelFetch(uAuxB, coord, 0).r;

    float uStar = ((uL + uR) * invHx2 + (uB + uT) * invHy2 - fC) / (2.0 * (invHx2 + invHy2) + uAlpha);
    fragColor = vec4(mix(uC, uStar, 0.8), 0.0, 0.0, 1.0);
  }
  else if (uPass == 11) {
    fragColor = vec4(0.0);
  }
  else if (uPass == 12) {
    ivec2 coordC = ivec2(gl_FragCoord.xy);
    ivec2 fineSize = ivec2(uTargetSize) * 2;
    ivec2 lastF = fineSize - ivec2(1);
    vec2 hf = uDomain / vec2(fineSize);
    float invHx2 = 1.0 / (hf.x * hf.x);
    float invHy2 = 1.0 / (hf.y * hf.y);
    float diag = 2.0 * (invHx2 + invHy2) + uAlpha;

    float resSum = 0.0;
    for (int dy = 0; dy < 2; dy++) {
      for (int dx = 0; dx < 2; dx++) {
        ivec2 cF = coordC * 2 + ivec2(dx, dy);
        float uC = texelFetch(uAuxA, cF, 0).r;
        float uL = cF.x == 0 ? uC : texelFetch(uAuxA, cF - ivec2(1, 0), 0).r;
        float uR = cF.x == lastF.x ? uC : texelFetch(uAuxA, cF + ivec2(1, 0), 0).r;
        float uB = cF.y == 0 ? uC : texelFetch(uAuxA, cF - ivec2(0, 1), 0).r;
        float uT = cF.y == lastF.y ? uC : texelFetch(uAuxA, cF + ivec2(0, 1), 0).r;
        float fF = texelFetch(uAuxB, cF, 0).r;

        float lap = (uL + uR) * invHx2 + (uB + uT) * invHy2 - diag * uC;
        resSum += (fF - lap);
      }
    }
    fragColor = vec4(resSum * 0.25, 0.0, 0.0, 1.0);
  }
  else if (uPass == 13) {
    ivec2 coordF = ivec2(gl_FragCoord.xy);
    vec2 uv = gl_FragCoord.xy / uTargetSize;
    float uFine = texelFetch(uAuxA, coordF, 0).r;
    float eCoarse = coarseBilinearR(uAuxB, uv, uTargetSize * 0.5);
    fragColor = vec4(uFine + eCoarse, 0.0, 0.0, 1.0);
  }
  else if (uPass == 14) {
    float val = texelFetch(uAuxA, ivec2(gl_FragCoord.xy), 0).r;
    fragColor = vec4(val * uScale, 0.0, 0.0, 1.0);
  }
  else if (uPass == 15) {
    ivec2 coord = ivec2(gl_FragCoord.xy);
    ivec2 last = ivec2(uTargetSize) - ivec2(1);
    vec2 h = uDomain / uTargetSize;
    vec2 wL = texelFetch(uInertVel, clamp(coord - ivec2(1, 0), ivec2(0), last), 0).rg;
    vec2 wR = texelFetch(uInertVel, clamp(coord + ivec2(1, 0), ivec2(0), last), 0).rg;
    vec2 wB = texelFetch(uInertVel, clamp(coord - ivec2(0, 1), ivec2(0), last), 0).rg;
    vec2 wT = texelFetch(uInertVel, clamp(coord + ivec2(0, 1), ivec2(0), last), 0).rg;
    float curl = (wR.y - wL.y) / (2.0 * h.x) - (wT.x - wB.x) / (2.0 * h.y);
    fragColor = vec4(curl, 0.0, 0.0, 1.0);
  }
  else if (uPass == 16) {
    ivec2 coord = ivec2(gl_FragCoord.xy);
    ivec2 last = ivec2(uTargetSize) - ivec2(1);
    vec2 uv = gl_FragCoord.xy / uTargetSize;
    vec2 h = uDomain / uTargetSize;
    float hAvg = 0.5 * (h.x + h.y);

    vec2 prevUv = rk4Back(uv, uDt);
    vec2 wAdv = simBilinearRG(uInertVel, prevUv);

    vec2 wL = texelFetch(uInertVel, clamp(coord - ivec2(1, 0), ivec2(0), last), 0).rg;
    vec2 wR = texelFetch(uInertVel, clamp(coord + ivec2(1, 0), ivec2(0), last), 0).rg;
    vec2 wB = texelFetch(uInertVel, clamp(coord - ivec2(0, 1), ivec2(0), last), 0).rg;
    vec2 wT = texelFetch(uInertVel, clamp(coord + ivec2(0, 1), ivec2(0), last), 0).rg;
    vec2 wAvg = 0.25 * (wL + wR + wB + wT);
    vec2 w = mix(wAdv, wAvg, clamp(uViscDiff * uDt * 18.0, 0.0, 0.45));

    w *= exp(-uDamping * uDt);

    if (uVortConf > 1e-5) {
      float cC = texelFetch(uCurl, coord, 0).r;
      float cL = abs(texelFetch(uCurl, clamp(coord - ivec2(1, 0), ivec2(0), last), 0).r);
      float cR = abs(texelFetch(uCurl, clamp(coord + ivec2(1, 0), ivec2(0), last), 0).r);
      float cB = abs(texelFetch(uCurl, clamp(coord - ivec2(0, 1), ivec2(0), last), 0).r);
      float cT = abs(texelFetch(uCurl, clamp(coord + ivec2(0, 1), ivec2(0), last), 0).r);
      vec2 gradAbsCurl = vec2((cR - cL) / (2.0 * h.x), (cT - cB) / (2.0 * h.y));
      float gLen = length(gradAbsCurl);
      if (gLen > 1e-5) {
        vec2 N = gradAbsCurl / gLen;
        vec2 fVort = uVortConf * hAvg * vec2(N.y * cC, -N.x * cC);
        w += fVort * uDt;
      }
    }

    if (uTool > 0) {
      float invFrameDt = 1.0 / max(uFrameDt, 0.004);
      vec2 tineVel = (uCenter - uPrevCenter) * uDomain * invFrameDt * uToolDrag;
      w = applyTine(w, uv, uPrevCenter, uCenter, tineVel, uStickRadius);
    }

    for (int i = 0; i < MAX_PINS; i++) {

    pressTex = makeTarget(simW, simH, gl.R32F, gl.RED, gl.FLOAT);
    allocateMultigrid();

    inkI = 0; backI = 0; fwdI = 0; surfI = 0; inertI = 0;

    // Resample existing ink level-set isotropically around the bath center
    gl.useProgram(program);
    gl.uniform2f(uOldInkSizeLoc, prevInk.w, prevInk.h);
    gl.uniform2f(uResizeScaleLoc, domainX / oldDomX, domainY / oldDomY);
    drawTo(inkTex[0], PASS_RESIZE_INK, prevInk.tex);
    inkI = 0;
    destroyTarget(prevInk);

    for (let r = 0; r < 2; r++) {
      drawTo(inkTex[1 - inkI], PASS_REDISTANCE);
      inkI = 1 - inkI;
    }

    drawTo(back[0], PASS_IDENTITY);
    drawTo(back[1], PASS_IDENTITY);
    drawTo(fwd[0], PASS_IDENTITY);
    drawTo(fwd[1], PASS_IDENTITY);
    drawTo(surfTex[0], PASS_ZERO);
    drawTo(surfTex[1], PASS_ZERO);
    drawTo(inertVelTex[0], PASS_ZERO);
    drawTo(inertVelTex[1], PASS_ZERO);
    drawTo(phiTex, PASS_ZERO);
    drawTo(pressTex, PASS_ZERO);
    drawTo(velTex, PASS_ZERO);
    drawTo(curlTex, PASS_ZERO);

    isSpreading = false;
    hasAdvectedSinceBake = false;

    const remapX = oldDomX / domainX;
    const remapY = oldDomY / domainY;
    for (const p of pins) {
      p.x = clampUv(0.5 + (p.x - 0.5) * remapX);
      p.y = clampUv(0.5 + (p.y - 0.5) * remapY);
      p.lastStampX = p.x;
      p.lastStampY = p.y;
      if (p.launch) {
        p.launch = [p.launch[0] * remapX, p.launch[1] * remapY];
      }
    }

    return true;
  }

  function solveMultigridVCycle(alpha, numVCycles) {
    gl.uniform1f(uAlphaLoc, alpha);
    const curIdx = new Int32Array(MG_LEVELS);

    for (let cycle = 0; cycle < numVCycles; cycle++) {
      for (let l = 0; l < MG_LEVELS - 1; l++) {
        const preSmoothSteps = (l === 0) ? 2 : 3;
        for (let s = 0; s < preSmoothSteps; s++) {
          const src = curIdx[l];
          const dst = 1 - src;
          drawTo(mgSol[l][dst], PASS_MG_SMOOTH, mgSol[l][src].tex, mgRhs[l].tex);
          curIdx[l] = dst;
        }
        drawTo(mgRhs[l + 1], PASS_MG_RESTRICT, mgSol[l][curIdx[l]].tex, mgRhs[l].tex);
        drawTo(mgSol[l + 1][0], PASS_ZERO);
        curIdx[l + 1] = 0;
      }

      const coarsest = MG_LEVELS - 1;
      for (let s = 0; s < 10; s++) {
        const src = curIdx[coarsest];
        const dst = 1 - src;
        drawTo(mgSol[coarsest][dst], PASS_MG_SMOOTH, mgSol[coarsest][src].tex, mgRhs[coarsest].tex);
        curIdx[coarsest] = dst;
      }

      for (let l = MG_LEVELS - 2; l >= 0; l--) {
        const src = curIdx[l];
        const dst = 1 - src;
        drawTo(mgSol[l][dst], PASS_MG_PROLONG, mgSol[l][src].tex, mgSol[l + 1][curIdx[l + 1]].tex);
        curIdx[l] = dst;

        const postSmoothSteps = (l === 0) ? 2 : 3;
        for (let s = 0; s < postSmoothSteps; s++) {
          const sSrc = curIdx[l];
          const sDst = 1 - sSrc;
          drawTo(mgSol[l][sDst], PASS_MG_SMOOTH, mgSol[l][sSrc].tex, mgRhs[l].tex);
          curIdx[l] = sDst;
        }
      }
    }
    return curIdx[0];
  }

  function pollAsyncGpuActivity(isActivelyWorking) {
    if (isActivelyWorking) {
      if (pendingSync) {
        gl.deleteSync(pendingSync);
        pendingSync = null;
      }
      return;
    }

    if (pendingSync) {
      const status = gl.clientWaitSync(pendingSync, 0, 0);
      if (status === gl.ALREADY_SIGNALED || status === gl.CONDITION_SATISFIED) {
        gl.deleteSync(pendingSync);
        pendingSync = null;

        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, energyPbo);
        gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, energyReadBuf);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);

        let maxActivity = 0;
        for (let i = 0; i < energyReadBuf.length; i++) {
          if (energyReadBuf[i] > maxActivity) maxActivity = energyReadBuf[i];
        }

        if (maxActivity <= 0.00045) {
          isSpreading = false;
          drawTo(velTex, PASS_ZERO);
          drawTo(inertVelTex[0], PASS_ZERO);
          drawTo(inertVelTex[1], PASS_ZERO);
        }
      }
    } else if (stepCount % 10 === 0) {
      drawTo(energyTarget, PASS_ENERGY);
      gl.bindFramebuffer(gl.FRAMEBUFFER, energyTarget.fbo);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, energyPbo);
      gl.readPixels(0, 0, ENERGY_RES, ENERGY_RES, gl.RED, gl.FLOAT, 0);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      pendingSync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    }
  }

  function exportHighRes(mimeType) {
    const exportW = inkW;
    const exportH = inkH;

    const exportFbo = gl.createFramebuffer();
    const exportTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, exportTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, exportW, exportH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, exportFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, exportTex, 0);

    gl.viewport(0, 0, exportW, exportH);
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    gl.uniform1i(uIsExportLoc, 1);
    gl.uniform1i(uPass, PASS_DISPLAY);
    gl.uniform2f(uTargetSize, exportW, exportH);

    bindInputs(null);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.uniform1i(uIsExportLoc, 0);

    const pixels = new Uint8Array(exportW * exportH * 4);
    gl.readPixels(0, 0, exportW, exportH, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

    gl.deleteTexture(exportTex);
    gl.deleteFramebuffer(exportFbo);

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = exportW;
    tempCanvas.height = exportH;
    const ctx = tempCanvas.getContext("2d");
    const imgData = ctx.createImageData(exportW, exportH);
    const rowBytes = exportW * 4;

    for (let y = 0; y < exportH; y++) {
      const topY = exportH - 1 - y;
      const srcOffset = y * rowBytes;
      const dstOffset = topY * rowBytes;
      imgData.data.set(pixels.subarray(srcOffset, srcOffset + rowBytes), dstOffset);
    }

    ctx.putImageData(imgData, 0, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, view.width, view.height);

    return tempCanvas.toDataURL(mimeType, 1.0);
  }

  function gpuClear() {
    if (pendingSync) {
      gl.deleteSync(pendingSync);
      pendingSync = null;
    }
    drawTo(inkTex[1 - inkI], PASS_CLEAR); inkI = 1 - inkI;
    drawTo(back[1 - backI], PASS_IDENTITY); backI = 1 - backI;
    drawTo(fwd[1 - fwdI], PASS_IDENTITY); fwdI = 1 - fwdI;
    drawTo(surfTex[0], PASS_ZERO); drawTo(surfTex[1], PASS_ZERO);
    drawTo(inertVelTex[0], PASS_ZERO); drawTo(inertVelTex[1], PASS_ZERO);
    drawTo(phiTex, PASS_ZERO);
    drawTo(pressTex, PASS_ZERO);
    drawTo(velTex, PASS_ZERO);
    drawTo(curlTex, PASS_ZERO);
    stepCount = 0;
    isSpreading = false;
    hasAdvectedSinceBake = false;
  }

  function placeImageInBath(squareCanvas) {
    input.tap = false;
    input.down = false;
    gpuClear();

    gl.bindTexture(gl.TEXTURE_2D, uploadTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, squareCanvas);
    gl.bindTexture(gl.TEXTURE_2D, null);

    drawTo(inkTex[1 - inkI], PASS_LOAD_IMAGE, uploadTex);
    inkI = 1 - inkI;

    drawTo(null, PASS_DISPLAY);
  }

  function gpuBake() {
    if (!hasAdvectedSinceBake) return;
    drawTo(inkTex[1 - inkI], PASS_BAKE); inkI = 1 - inkI;
    for (let r = 0; r < 2; r++) {
      drawTo(inkTex[1 - inkI], PASS_REDISTANCE);
      inkI = 1 - inkI;
    }
    drawTo(back[1 - backI], PASS_IDENTITY); backI = 1 - backI;
    drawTo(fwd[1 - fwdI], PASS_IDENTITY); fwdI = 1 - fwdI;
    hasAdvectedSinceBake = false;
  }

  function gpuStamp(isNewDrop) {
    if (isNewDrop && hasAdvectedSinceBake) {
      gpuBake();
    }
    gl.uniform1i(uIsNewDropLoc, isNewDrop ? 1 : 0);
    gl.uniform3f(
      uInkColor,
      (ink & 255) / 255,
      ((ink >> 8) & 255) / 255,
      ((ink >> 16) & 255) / 255
    );
    gl.uniform2f(uCenter, input.x, input.y);
    gl.uniform1f(uRadius, INK_RADIUS * dropSizeMult);
    drawTo(inkTex[1 - inkI], PASS_STAMP);
    inkI = 1 - inkI;
    input.stampX = input.x;
    input.stampY = input.y;
  }

  function seedInitialBath() {
    gpuClear();
    const drops = [
      [0.48, 0.50, 1.4],
      [0.48, 0.50, 1.2],
      [0.35, 0.38, 1.1],
      [0.35, 0.38, 0.9],
      [0.64, 0.62, 1.3],
      [0.64, 0.62, 1.0],
      [0.52, 0.48, 1.2],
      [0.52, 0.48, 0.95]
    ];
    const savedTool = activeTool;
    activeTool = 0;
    drops.forEach(([x, y, sz], idx) => {
      ink = hexToPack(dynamicPalette[idx % dynamicPalette.length][1]);
      input.x = x;
      input.y = y;
      dropSizeMult = sz;
      input.tap = true;
      for (let i = 0; i < 8; i++) {
        step(DT, DT);
      }
    });
    dropSizeMult = 1.0;
    ink = hexToPack(dynamicPalette[currentSwatchIndex][1]);

    activeTool = 1;
    input.down = true;
    const path = [
      [0.25, 0.30], [0.45, 0.28], [0.65, 0.45],
      [0.50, 0.60], [0.32, 0.72], [0.70, 0.75]
    ];
    for (let p = 0; p < path.length - 1; p++) {
      const [x0, y0] = path[p];
      const [x1, y1] = path[p + 1];
      for (let s = 0; s < 10; s++) {
        const t = s / 10;
        input.xPrev = input.x;
        input.yPrev = input.y;
        input.x = x0 + (x1 - x0) * t;
        input.y = y0 + (y1 - y0) * t;
        step(DT, DT);
      }
