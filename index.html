    }
    input.down = false;
    activeTool = savedTool;
    drawTo(null, PASS_DISPLAY);
  }

  // =========================================================
  // Pin / Slingshot System (for both Sumi Inks & Bamboo Stick)
  //   - Tap empty water        -> place a pin (ink bead or stylus point)
  //   - Drag back from a pin   -> elastic slingshot vector
  //   - Tap a pin              -> clear slingshot, or remove pin
  //   - Drag on empty water    -> master stroke: sweeps unassigned pins while firing slingshots
  //   - Release button / F key -> release all ink pins (ink mode) or fire slingshots (stick mode)
  //   - Grid dropdown          -> spawn symmetric grids (2x2, 3x3, 4x4, Ring 6, Ring 8, Cross)
  // =========================================================
  const MAX_PINS = 32;            // must match MAX_PINS in the fragment shader
  const SLING_POWER = 1.75;       // launch distance = pull distance * power
  const SLING_MAX_PULL = 0.25;    // max elastic stretch in bath UV
  const PIN_TAP_PX = 6;           // screen px before a press counts as a drag

  let pushInkActive = false;      // false = Drop only; true = Drop + Push (latte pin push)
  let stickMode = "stir";         // "stir" | "pins"
  let keepInkPins = false;
  let keepStickPins = false;
  const pins = [];                // { kind, x, y, color, colorHex, launch: [dx, dy] | null, state, flight, hoverTime, lastStampX, lastStampY }
  let pinGesture = null;
  let masterStroke = null;
  const pinSegBuf = new Float32Array(MAX_PINS * 4);
  const pinVelBuf = new Float32Array(MAX_PINS * 2);
  let pinSegCount = 0;
  let stepsSincePourBake = 0;

  function activePinKind() {
    if (activeTool === 0 && pushInkActive) return "ink";
    if (activeTool === 1 && stickMode === "pins") return "stick";
    return null;
  }
  function pinsModeActive() { return activePinKind() !== null; }
  function isLatteMode() { return activeTool === 0 && pushInkActive; }

  function ensureLattePins() {
    const inkPins = pins.filter(p => p.kind === "ink");
    if (inkPins.length === 0) {
      const activeHex = dynamicPalette[currentSwatchIndex] ? dynamicPalette[currentSwatchIndex][1] : "#161514";
      pins.push({
        kind: "ink",
        x: 0.5,
        y: 0.5,
        color: ink,
        colorHex: activeHex,
        launch: null,
        state: "idle",
        flight: null,
        hoverTime: 0,
        lastStampX: 0.5,
        lastStampY: 0.5
      });
      updatePinUI();
      drawRing();
    }
  }
  function clampUv(v) { return Math.max(0.003, Math.min(0.997, v)); }
  function pinHitRadius() {
    const k = activePinKind();
    return (k === "ink")
      ? Math.max(0.026, INK_RADIUS * dropSizeMult * 0.75)
      : Math.max(0.022, STICK_BASE_RADIUS * stylusRadiusMult * 1.4);
  }

  function findPinAt(x, y) {
    const r = pinHitRadius();
    let best = null, bestD = r * r;
    const currentKind = activePinKind();
    // Prefer pins matching the active tool mode
    for (const pin of pins) {
      if (pin.state !== "idle" || pin.kind !== currentKind) continue;
      const dx = (pin.x - x) * domainX;
      const dy = (pin.y - y) * domainY;
      const d = dx * dx + dy * dy;
      if (d <= bestD) { bestD = d; best = pin; }
    }
    if (best) return best;
    // Otherwise allow interacting with any idle pin
    for (const pin of pins) {
      if (pin.state !== "idle") continue;
      const dx = (pin.x - x) * domainX;
      const dy = (pin.y - y) * domainY;
      const d = dx * dx + dy * dy;
      if (d <= bestD) { bestD = d; best = pin; }
    }
    return best;
  }

  function addPin(x, y) {
    if (pins.length >= MAX_PINS) return null;
    const kind = activePinKind() || "stick";
    let col = ink;
    let hex = dynamicPalette[currentSwatchIndex] ? dynamicPalette[currentSwatchIndex][1] : "#161514";
    const pin = {
      kind,
      x: clampUv(x),
      y: clampUv(y),
      color: col,
      colorHex: hex,
      launch: null,
      state: "idle",
      flight: null,
      hoverTime: 0,
      lastStampX: clampUv(x),
      lastStampY: clampUv(y)
    };
    pins.push(pin);
    if (kind === "ink" && sumiMode) {
      cycleColor();
    }
    return pin;
  }

  function generatePinGrid(kind, type) {
    // Clear pins of this kind first
    for (let i = pins.length - 1; i >= 0; i--) {
      if (pins[i].kind === kind) pins.splice(i, 1);
    }

    if (kind === "ink") {
      keepInkPins = true;
      const keepEl = document.getElementById("ink-pin-keep");
      if (keepEl) keepEl.checked = true;
    }

    const baseCoords = [];
    if (type === "1pin") {
      baseCoords.push([0.5, 0.5]);
    } else if (type === "2x2") {
      const xs = [0.36, 0.64], ys = [0.36, 0.64];
      for (const y of ys) for (const x of xs) baseCoords.push([x, y]);
    } else if (type === "3x3") {
      const xs = [0.26, 0.50, 0.74], ys = [0.26, 0.50, 0.74];
      for (const y of ys) for (const x of xs) baseCoords.push([x, y]);
    } else if (type === "4x4") {
      const xs = [0.20, 0.40, 0.60, 0.80], ys = [0.20, 0.40, 0.60, 0.80];
      for (const y of ys) for (const x of xs) baseCoords.push([x, y]);
    } else if (type === "ring6") {
      const R = 0.24, cx = 0.5, cy = 0.5;
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI) / 3;
        baseCoords.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]);
      }
    } else if (type === "ring8") {
      const R = 0.26, cx = 0.5, cy = 0.5;
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        baseCoords.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]);
      }
    } else if (type === "cross") {
      baseCoords.push([0.5, 0.5], [0.5, 0.25], [0.5, 0.75], [0.25, 0.5], [0.75, 0.5]);
    }

    // Keep symmetric grids physically square/circular across widescreen & portrait full-screen baths
    const coords = baseCoords.map(([x, y]) => [
      0.5 + (x - 0.5) / domainX,
      0.5 + (y - 0.5) / domainY
    ]);

    const available = MAX_PINS - pins.length;
    const toAdd = coords.slice(0, available);

    const activeHex = dynamicPalette[currentSwatchIndex] ? dynamicPalette[currentSwatchIndex][1] : "#161514";
    const activeColor = ink;

    toAdd.forEach(([x, y]) => {
      pins.push({
        kind,
        x: clampUv(x),
        y: clampUv(y),
        color: activeColor,
        colorHex: activeHex,
        launch: null,
        state: "idle",
        flight: null,
        hoverTime: 0,
        lastStampX: clampUv(x),
        lastStampY: clampUv(y)
      });
    });

    updatePinUI();
    drawRing();
  }

  function removePin(pin) {
    const i = pins.indexOf(pin);
    if (i >= 0) pins.splice(i, 1);
  }

  function clearPinsByKind(kind) {
    for (let i = pins.length - 1; i >= 0; i--) {
      if (!kind || pins[i].kind === kind) {
        pins.splice(i, 1);
      }
    }
    pinGesture = null;
    masterStroke = null;
    updatePinUI();
    drawRing();
  }

  function clearPins() {
    clearPinsByKind(null);
  }

  // Clamped elastic pull vector (anchor -> pouch) in isotropic physical units, returned as UV offset
  function clampedPull(pin, px, py) {
    let dxP = (px - pin.x) * domainX;
    let dyP = (py - pin.y) * domainY;
    const len = Math.hypot(dxP, dyP);
    if (len > SLING_MAX_PULL) {
      dxP *= SLING_MAX_PULL / len;
      dyP *= SLING_MAX_PULL / len;
    }
    return [dxP / domainX, dyP / domainY, Math.min(len, SLING_MAX_PULL)];
  }

  function computeLaunch(pin, px, py) {
    const [dx, dy, len] = clampedPull(pin, px, py);
    if (len < 0.006) return null;
    return [-dx * SLING_POWER, -dy * SLING_POWER];
  }

  function launchPin(pin) {
    const tx = clampUv(pin.x + pin.launch[0]);
    const ty = clampUv(pin.y + pin.launch[1]);
    const dist = Math.hypot((tx - pin.x) * domainX, (ty - pin.y) * domainY);
    pin.flight = { fx: pin.x, fy: pin.y, tx, ty, t: 0, dur: 0.3 + 0.9 * dist };
    pin.state = "flying";
  }

  // Release all idle ink pins simultaneously onto the bath
  function releaseInkPins() {
    const inkPins = pins.filter(p => p.kind === "ink" && p.state === "idle");
    if (inkPins.length === 0) return 0;

    if (hasAdvectedSinceBake) {
      gpuBake();
    }

    const radius = INK_RADIUS * dropSizeMult;
    const mass = (2.8 + 1.2 * flowRateMult);
    gl.uniform1f(uMassLoc, mass);
    gl.uniform1f(uRadius, radius);

    // 1. Splat surface tension mass for all ink pins simultaneously
    for (const pin of inkPins) {
      gl.uniform2f(uCenter, pin.x, pin.y);
      drawTo(surfTex[1 - surfI], PASS_SPLAT);
      surfI = 1 - surfI;
    }

    // 2. Stamp ink droplets into inkTex simultaneously
    gl.uniform1i(uIsNewDropLoc, 1);
    gl.uniform1f(uRadius, radius);
    for (const pin of inkPins) {
      const col = pin.color !== undefined ? pin.color : ink;
      gl.uniform3f(
        uInkColor,
        (col & 255) / 255,
        ((col >> 8) & 255) / 255,
        ((col >> 16) & 255) / 255
      );
      gl.uniform2f(uCenter, pin.x, pin.y);
      drawTo(inkTex[1 - inkI], PASS_STAMP);
      inkI = 1 - inkI;
    }

    isSpreading = true;

    // 3. Launch slingshot ink pins, or retire stationary pins if keep is off
    for (const pin of inkPins) {
      if (pin.launch) {
        launchPin(pin);
      } else if (!keepInkPins) {
        pin.state = "done";
      }
    }

    pouredDrop = false;

    // 4. Advance color palette if auto-cycle is enabled
    if (sumiMode) {
      cycleColor();
    } else {
      // If auto-cycle is off, keep existing colors or ensure sync
      const curHex = dynamicPalette[currentSwatchIndex] ? dynamicPalette[currentSwatchIndex][1] : "#161514";
      for (const pin of inkPins) {
        if (pin.state === "idle") {
          pin.color = ink;
          pin.colorHex = curHex;
        }
      }
    }

    if (!masterStroke) {
      finalizePinRun();
    }

    drawTo(null, PASS_DISPLAY);
    updatePinUI();
    return inkPins.length;
  }

  function handleLattePointerDown(px, py) {
    let inkPins = pins.filter(p => p.kind === "ink");
    if (inkPins.length === 0) {
      ensureLattePins();
      inkPins = pins.filter(p => p.kind === "ink");
    }

    // Color sync: ensure pin colors match active swatch
    const activeHex = dynamicPalette[currentSwatchIndex] ? dynamicPalette[currentSwatchIndex][1] : "#161514";
    for (const p of inkPins) {
      p.color = ink;
      p.colorHex = activeHex;
    }

    // Relocate pins so they center at the contact point (px, py)
    const hitPin = findPinAt(px, py);
    if (hitPin && inkPins.length > 1) {
      const dx = px - hitPin.x;
      const dy = py - hitPin.y;
      for (const p of inkPins) {
        p.x = clampUv(p.x + dx);
        p.y = clampUv(p.y + dy);
        p.lastStampX = p.x;
        p.lastStampY = p.y;
        p.hoverTime = 0;
      }
    } else if (inkPins.length === 1) {
      const p = inkPins[0];
      p.x = clampUv(px);
      p.y = clampUv(py);
      p.lastStampX = p.x;
      p.lastStampY = p.y;
      p.hoverTime = 0;
    } else {
      let cx = 0, cy = 0;
      for (const p of inkPins) { cx += p.x; cy += p.y; }
      cx /= inkPins.length; cy /= inkPins.length;
      const dx = px - cx;
      const dy = py - cy;
      for (const p of inkPins) {
        p.x = clampUv(p.x + dx);
        p.y = clampUv(p.y + dy);
        p.lastStampX = p.x;
        p.lastStampY = p.y;
        p.hoverTime = 0;
      }
    }

    if (hasAdvectedSinceBake) {
      gpuBake();
    }
    stepsSincePourBake = 0;

    // Initial surface contact pour
    const radius = INK_RADIUS * dropSizeMult;
    const addedMass = (2.8 + 1.2 * flowRateMult);
    gl.uniform1f(uMassLoc, addedMass);
    gl.uniform1f(uRadius, radius);
    for (const pin of inkPins) {
      gl.uniform2f(uCenter, pin.x, pin.y);
      drawTo(surfTex[1 - surfI], PASS_SPLAT);
      surfI = 1 - surfI;
    }

    gl.uniform1i(uIsNewDropLoc, 1);
    gl.uniform1f(uRadius, radius);
    for (const pin of inkPins) {
      const col = pin.color !== undefined ? pin.color : ink;
      gl.uniform3f(
        uInkColor,
        (col & 255) / 255,
        ((col >> 8) & 255) / 255,
        ((col >> 16) & 255) / 255
      );
      gl.uniform2f(uCenter, pin.x, pin.y);
      drawTo(inkTex[1 - inkI], PASS_STAMP);
      inkI = 1 - inkI;
    }

    isSpreading = true;
    pouredDrop = true;
    drawTo(null, PASS_DISPLAY);
  }

  function fireSlingshots() {
    let fired = 0;
    const targetKind = activePinKind();
    for (const pin of pins) {
      if (pin.state === "idle" && pin.launch && (!targetKind || pin.kind === targetKind)) {
        if (pin.kind === "ink") {
          // Ink slingshot drops ink before flying
          releaseInkPins();
          fired++;
          break;
        } else {
          launchPin(pin);
          fired++;
        }
      }
    }
    updatePinUI();
    return fired;
  }

  function beginMasterStroke(x0, y0) {
    const currentKind = activePinKind();
    if (currentKind === "ink") {
      releaseInkPins();
    } else {
      fireSlingshots();
    }
    for (const pin of pins) {
      if (pin.state === "idle" && !pin.launch && (!currentKind || pin.kind === currentKind)) {
        pin.state = "following";
      }
    }
    masterStroke = { lastX: x0, lastY: y0 };
  }

  function endMasterStroke() {
    masterStroke = null;
    for (const pin of pins) {
      if (pin.state === "following") pin.state = "done";
    }
  }

  function finalizePinRun() {
    let changed = false;
    for (let i = pins.length - 1; i >= 0; i--) {
      const pin = pins[i];
      if (pin.state !== "done") continue;
      changed = true;
      const keep = (pin.kind === "ink") ? keepInkPins : keepStickPins;
      if (keep) {
        pin.state = "idle";
      } else {
        pins.splice(i, 1);
      }
    }
    if (changed) updatePinUI();
  }

  function pushPinSeg(ax, ay, bx, by, vx, vy) {
    if (pinSegCount >= MAX_PINS) return;
    const i = pinSegCount++;
    pinSegBuf[i * 4] = ax; pinSegBuf[i * 4 + 1] = ay;
    pinSegBuf[i * 4 + 2] = bx; pinSegBuf[i * 4 + 3] = by;
    pinVelBuf[i * 2] = vx * domainX * stylusDragMult;
    pinVelBuf[i * 2 + 1] = vy * domainY * stylusDragMult;
  }

  // Advances pin positions for one sim step and fills the moving-segment uniforms.
  // Returns true while any pin run (master stroke or slingshot flight) is in progress.
  function advancePins(dt, frameDelta) {
    pinSegCount = 0;
    let busy = false;

    if (masterStroke) {
      busy = true;
      const dx = input.x - masterStroke.lastX;
      const dy = input.y - masterStroke.lastY;
      masterStroke.lastX = input.x;
      masterStroke.lastY = input.y;
      if (dx * dx + dy * dy > 1e-12) {
        const inv = 1 / Math.max(frameDelta, 0.004);
        for (const pin of pins) {
          if (pin.state !== "following") continue;
          const ox = pin.x, oy = pin.y;
          pin.x = clampUv(pin.x + dx);
          pin.y = clampUv(pin.y + dy);
          pushPinSeg(ox, oy, pin.x, pin.y, (pin.x - ox) * inv, (pin.y - oy) * inv);
        }
      }
    }

    for (const pin of pins) {
      if (pin.state !== "flying") continue;
      busy = true;
      const f = pin.flight;
      f.t = Math.min(f.dur, f.t + dt);
      const s = 1 - Math.pow(1 - f.t / f.dur, 3); // ease-out: snaps forward, then glides to rest
      const ox = pin.x, oy = pin.y;
      pin.x = f.fx + (f.tx - f.fx) * s;
      pin.y = f.fy + (f.ty - f.fy) * s;
      pushPinSeg(ox, oy, pin.x, pin.y, (pin.x - ox) / dt, (pin.y - oy) / dt);
      if (f.t >= f.dur) { pin.state = "done"; pin.flight = null; }
    }

    if (!masterStroke) finalizePinRun();
    return busy;
  }

  function finishPinGesture(cancelled) {
    const g = pinGesture;
    pinGesture = null;
    if (!g) return;
    if (g.type === "pending") {
      if (!cancelled) addPin(g.sx, g.sy);
    } else if (g.type === "pull") {
      if (!cancelled) {
        if (g.moved) {
          g.pin.launch = computeLaunch(g.pin, g.px, g.py);
        } else if (g.pin.launch) {
          g.pin.launch = null;
        } else {
          removePin(g.pin);
        }
      }
    } else if (g.type === "stroke") {
      endMasterStroke();
    }
    updatePinUI();
  }

  function updatePinUI() {
    // 1. Bamboo Stick Pin UI
    const stickCountEl = document.getElementById("pin-count");
    const stickFireBtn = document.getElementById("pin-fire");
    if (stickCountEl && stickFireBtn) {
      const stickPins = pins.filter(p => p.kind === "stick");
      const slings = stickPins.filter(p => p.state === "idle" && p.launch).length;
      const total = stickPins.length;
      stickCountEl.textContent = total === 0
        ? "No pins"
        : `${total} pin${total === 1 ? "" : "s"}` + (slings ? ` · ${slings} sling` : "");
      stickFireBtn.disabled = slings === 0;
    }

    // 2. Sumi Inks Push Pin UI
    const inkCountEl = document.getElementById("ink-pin-count");
    if (inkCountEl) {
      const inkPins = pins.filter(p => p.kind === "ink");
      const total = inkPins.length;
      inkCountEl.textContent = total === 0
        ? "No pins"
        : `${total} push pin${total === 1 ? "" : "s"}`;
    }
  }

  function drawPinArrow(ctx, x0, y0, x1, y1, unit, color) {
    const dx = x1 - x0, dy = y1 - y0;
    const L = Math.hypot(dx, dy);
    if (L < 2) return;
    const ux = dx / L, uy = dy / L;
    const head = Math.min(L * 0.45, 11 * unit);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2 * unit;
    ctx.setLineDash([5 * unit, 5 * unit]);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1 - ux * head * 0.8, y1 - uy * head * 0.8);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ux * head - uy * head * 0.55, y1 - uy * head + ux * head * 0.55);
    ctx.lineTo(x1 - ux * head + uy * head * 0.55, y1 - uy * head - ux * head * 0.55);
    ctx.closePath();
    ctx.fill();
  }

  function drawPins() {
    if (pins.length === 0 && !pinGesture) return;
    const w = ring.width, h = ring.height;
    const minDim = Math.min(w, h);
    const ctx = ringCtx;
    const unit = minDim / 800;
    const currentKind = activePinKind();

    ctx.save();

    // Master stroke trail
    if (pinGesture && pinGesture.type === "stroke" && pinGesture.trail.length > 1) {
      ctx.setLineDash([6 * unit, 6 * unit]);
      ctx.strokeStyle = "rgba(245, 235, 215, 0.55)";
      ctx.lineWidth = 2 * unit;
      ctx.beginPath();
      pinGesture.trail.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p[0] * w, p[1] * h);
        else ctx.lineTo(p[0] * w, p[1] * h);
      });
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const pin of pins) {
      if (pin.kind === "ink" && !pushInkActive) continue;
      const isCurrentKind = (pin.kind === currentKind);
      ctx.globalAlpha = isCurrentKind ? 1.0 : 0.45;

      const x = pin.x * w, y = pin.y * h;
      const pulling = pinGesture && pinGesture.type === "pull" && pinGesture.pin === pin && pinGesture.moved;
      const launch = pulling ? computeLaunch(pin, pinGesture.px, pinGesture.py) : pin.launch;
      const isSling = !!launch;

      // Trajectory arrow
      if (pin.state === "idle" && launch) {
        const tx = clampUv(pin.x + launch[0]) * w;
        const ty = clampUv(pin.y + launch[1]) * h;
        const arrowCol = pin.kind === "ink"
          ? (pin.colorHex || "rgba(222, 92, 62, 0.95)")
          : "rgba(222, 92, 62, 0.92)";
        drawPinArrow(ctx, x, y, tx, ty, unit, arrowCol);
      }

      // Slingshot pull rubber band
      if (pulling) {
        const [pdx, pdy, plen] = clampedPull(pin, pinGesture.px, pinGesture.py);
        const px = x + pdx * w, py = y + pdy * h;
        const L = Math.hypot(pdx * w, pdy * h) || 1;
        const nx = -(pdy * h) / L, ny = (pdx * w) / L;
        const R = (pin.kind === "ink")
          ? INK_RADIUS * dropSizeMult * minDim * 0.45
          : STICK_BASE_RADIUS * stylusRadiusMult * minDim;
        const fork = R * 1.1 + 4 * unit;
        const stretch = plen / SLING_MAX_PULL;
        ctx.strokeStyle = `rgba(${Math.round(110 + 110 * stretch)}, 52, 34, 0.92)`;
        ctx.lineWidth = Math.max(1, (3.2 - 1.8 * stretch) * unit);
        ctx.beginPath();
        ctx.moveTo(x + nx * fork, y + ny * fork);
        ctx.lineTo(px, py);
        ctx.moveTo(x - nx * fork, y - ny * fork);
        ctx.lineTo(px, py);
        ctx.stroke();

        ctx.fillStyle = pin.kind === "ink" ? (pin.colorHex || "#161514") : "rgba(58, 38, 24, 0.92)";
        ctx.beginPath();
        ctx.arc(px, py, 6 * unit, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        ctx.lineWidth = 1 * unit;
        ctx.stroke();
      }

      if (pin.kind === "ink") {
        // --- INK PIN VISUALS ---
        const dropR = INK_RADIUS * dropSizeMult * minDim;
        const beadR = Math.max(5 * unit, Math.min(dropR * 0.5, 12 * unit));

        // When in active latte pouring, draw glowing pouring pulse rings
        if (isLatteMode() && input.down) {
          ctx.save();
          ctx.strokeStyle = "rgba(255, 230, 180, 0.75)";
          ctx.lineWidth = 2.0 * unit;
          const pulse = 1.0 + 0.22 * Math.sin(Date.now() * 0.016);
          ctx.beginPath();
          ctx.arc(x, y, dropR * 1.25 * pulse, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Droplet boundary ring
        ctx.setLineDash([3 * unit, 3 * unit]);
        ctx.strokeStyle = (isLatteMode() && input.down) ? "rgba(255, 240, 200, 0.95)" : "rgba(240, 230, 215, 0.5)";
        ctx.lineWidth = 1.2 * unit;
        ctx.beginPath();
        ctx.arc(x, y, dropR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        // Rich ink bead
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.55)";
        ctx.shadowBlur = 4 * unit;
        ctx.shadowOffsetY = 1.5 * unit;

        const hex = pin.colorHex || "#161514";
        const grad = ctx.createRadialGradient(x - beadR * 0.35, y - beadR * 0.4, beadR * 0.1, x, y, beadR);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.35, hex);
        grad.addColorStop(1, "#0a0806");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, beadR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Droplet rim
        ctx.strokeStyle = isSling ? "rgba(222, 92, 62, 0.95)" : "rgba(255, 250, 240, 0.75)";
        ctx.lineWidth = 1.4 * unit;
        ctx.beginPath();
        ctx.arc(x, y, beadR, 0, Math.PI * 2);
        ctx.stroke();

      } else {
        // --- STICK PIN VISUALS ---
        const R = STICK_BASE_RADIUS * stylusRadiusMult * minDim;
        const dotR = Math.max(4 * unit, Math.min(R * 0.45, 9 * unit));

        // Stylus influence ring
        ctx.strokeStyle = pin.state === "idle" ? "rgba(235, 225, 210, 0.55)" : "rgba(255, 240, 200, 0.9)";
        ctx.lineWidth = 1.2 * unit;
        ctx.beginPath();
        ctx.arc(x, y, R, 0, Math.PI * 2);
        ctx.stroke();

        // Pin head: brass for default, vermilion for slingshot
        const grad = ctx.createRadialGradient(x - dotR * 0.35, y - dotR * 0.4, dotR * 0.1, x, y, dotR);
        if (isSling) {
          grad.addColorStop(0, "#ffd2b8");
          grad.addColorStop(0.55, "#c4442a");
          grad.addColorStop(1, "#5a160b");
        } else {
          grad.addColorStop(0, "#fff2c2");
          grad.addColorStop(0.6, "#d49b35");
          grad.addColorStop(1, "#6e4411");
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, dotR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(30, 20, 12, 0.85)";
        ctx.lineWidth = 1.4 * unit;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function reset() {
    input.tap = false;
    gpuClear();
    drawTo(null, PASS_DISPLAY);
  }

  function step(dt, frameDelta) {
    const pointerWorking = input.down || input.tap;
    const pinMotion = advancePins(dt, frameDelta);
    const isActivelyWorking = pointerWorking || pinMotion;

    if (isActivelyWorking) {
      if (!isSpreading) {
        isSpreading = true;
      }
      if (input.down && isLatteMode()) {
        const inkPins = pins.filter(p => p.kind === "ink");
        if (inkPins.length > 0) {
          stepsSincePourBake++;
          if (stepsSincePourBake >= 40 && hasAdvectedSinceBake) {
            gpuBake();
            stepsSincePourBake = 0;
          }

          const dx = input.x - input.xPrev;
          const dy = input.y - input.yPrev;
          const invDt = 1 / Math.max(frameDelta, 0.004);
          const radius = INK_RADIUS * dropSizeMult;
          const addedMass = (4.4 * dt) * flowRateMult;

          gl.uniform1f(uMassLoc, addedMass);
          gl.uniform1f(uRadius, radius);

          for (const pin of inkPins) {
            const ox = pin.x, oy = pin.y;
            pin.x = clampUv(pin.x + dx);
            pin.y = clampUv(pin.y + dy);

            // Forward viscous push and dipole wake in the bath
            if (dx * dx + dy * dy > 1e-12) {
              pushPinSeg(ox, oy, pin.x, pin.y, (pin.x - ox) * invDt, (pin.y - oy) * invDt);
            }

            // Continuous surfactant mass splat
            gl.uniform2f(uCenter, pin.x, pin.y);
            drawTo(surfTex[1 - surfI], PASS_SPLAT);
            surfI = 1 - surfI;

            // Continuous stamp: if moved beyond threshold or hovered for ~0.075s
            if (pin.lastStampX === undefined) {
              pin.lastStampX = pin.x;
              pin.lastStampY = pin.y;
              pin.hoverTime = 0;
            }
            const movedDist = Math.hypot((pin.x - pin.lastStampX) * domainX, (pin.y - pin.lastStampY) * domainY);
            pin.hoverTime = (pin.hoverTime || 0) + dt;

            if (movedDist > radius * 0.28 || pin.hoverTime > 0.075) {
              gl.uniform1i(uIsNewDropLoc, 0);
              gl.uniform1f(uRadius, radius);
              const col = pin.color !== undefined ? pin.color : ink;
              gl.uniform3f(
                uInkColor,
                (col & 255) / 255,
                ((col >> 8) & 255) / 255,
                ((col >> 16) & 255) / 255
              );
              gl.uniform2f(uCenter, pin.x, pin.y);
              drawTo(inkTex[1 - inkI], PASS_STAMP);
              inkI = 1 - inkI;

              pin.lastStampX = pin.x;
              pin.lastStampY = pin.y;
              pin.hoverTime = 0;
            }
          }
        }
      } else if (pointerWorking && activeTool === 0 && !pinsModeActive()) {
        if (!input.tap) {
          stepsSincePourBake++;
          if (stepsSincePourBake >= 45 && hasAdvectedSinceBake) {
            gpuBake();
            stepsSincePourBake = 0;
          }
        } else {
          stepsSincePourBake = 0;
        }

        const radius = INK_RADIUS * dropSizeMult;
        const addedMass = (4.4 * dt + (input.tap ? 1.35 : 0)) * flowRateMult;
        gl.uniform1f(uMassLoc, addedMass);
        gl.uniform2f(uCenter, input.x, input.y);
        gl.uniform1f(uRadius, radius);
        drawTo(surfTex[1 - surfI], PASS_SPLAT);
        surfI = 1 - surfI;

        if (input.tap) {
          gpuStamp(true);
        } else {
          const movedDist = Math.hypot((input.x - input.stampX) * domainX, (input.y - input.stampY) * domainY);
          if (movedDist > radius * 0.30) {
            gpuStamp(false);
          }
        }
      }
      input.tap = false;
    }

    if (!isSpreading) return false;

    const T = tension();
    const V = viscosity();
    gl.uniform1f(uSeqLoc, 0.042 / T);
    gl.uniform1f(uRateLoc, 10.5 * T / V);

    drawTo(mgRhs[0], PASS_SURF_RHS);
    gl.uniform1f(uScaleLoc, 0.85);
    drawTo(mgSol[0][0], PASS_WARM_START, phiTex.tex);
    const phiFinalIdx = solveMultigridVCycle(0.06, 2);
    const tmpPhi = phiTex;
    phiTex = mgSol[0][phiFinalIdx];
    mgSol[0][phiFinalIdx] = tmpPhi;

    if (vortValue > 1e-5) {
      drawTo(curlTex, PASS_VORTICITY);
    }

    gl.uniform1f(uDt, dt);
    gl.uniform1f(uFrameDtLoc, frameDelta);
    gl.uniform1f(uDampingLoc, ekmanDamping());
    gl.uniform1f(uViscDiffLoc, 0.15 + 0.35 * (1.0 - diffValue));
    gl.uniform1f(uVortConfLoc, vortValue * 8.5);

    gl.uniform1i(uTool, (pointerWorking && !pinsModeActive()) ? activeTool : 0);
    gl.uniform1f(uToolDragLoc, stylusDragMult);
    gl.uniform2f(uCenter, input.x, input.y);
    gl.uniform2f(uPrevCenter, input.xPrev, input.yPrev);
    gl.uniform2f(uRakeDir, input.dirX, input.dirY);
    gl.uniform2f(uPrevRakeDir, input.prevDirX, input.prevDirY);
    gl.uniform1f(uStickRadius, STICK_BASE_RADIUS * stylusRadiusMult);
    gl.uniform1i(uPinCountLoc, pinSegCount);
    if (pinSegCount > 0) {
      gl.uniform4fv(uPinSegLoc, pinSegBuf);
      gl.uniform2fv(uPinVelLoc, pinVelBuf);
    }

    drawTo(inertVelTex[1 - inertI], PASS_ADVECT_INERTIAL);
    inertI = 1 - inertI;
    gl.uniform1i(uPinCountLoc, 0);

    drawTo(mgRhs[0], PASS_NS_DIV);
    gl.uniform1f(uScaleLoc, 0.90);
    drawTo(mgSol[0][0], PASS_WARM_START, pressTex.tex);
    const pressFinalIdx = solveMultigridVCycle(0.0002, 2);
    const tmpPress = pressTex;
    pressTex = mgSol[0][pressFinalIdx];
    mgSol[0][pressFinalIdx] = tmpPress;

    drawTo(inertVelTex[1 - inertI], PASS_NS_PROJECT);
    inertI = 1 - inertI;

    drawTo(velTex, PASS_COMBINE_VEL);

    const sub = 3;
    const sdt = dt / sub;
    gl.uniform1f(uDt, sdt);
    for (let s = 0; s < sub; s++) {
      drawTo(surfTex[1 - surfI], PASS_ADVECT_SURF); surfI = 1 - surfI;
      drawTo(back[1 - backI], PASS_BACK); backI = 1 - backI;
      drawTo(fwd[1 - fwdI], PASS_FWD); fwdI = 1 - fwdI;
    }

    hasAdvectedSinceBake = true;
    stepCount++;
    if (!input.down && stepCount % 2400 === 0) gpuBake();

    pollAsyncGpuActivity(isActivelyWorking);

    return true;
  }

  function drawRing() {
    const w = ring.width;
    const h = ring.height;
    const minDim = Math.min(w, h);
    ringCtx.clearRect(0, 0, w, h);

    drawPins();

    if (!(input.inside || input.down)) {
      toolCursor.classList.remove("visible", "pressing");
      return;
    }

    ringCtx.strokeStyle = "rgba(235, 225, 210, 0.65)";
    ringCtx.lineWidth = Math.max(1.2, minDim / 480);

    const radius = (activeTool === 0)
      ? 0.034 * Math.sqrt(0.72) * minDim * dropSizeMult
      : STICK_BASE_RADIUS * minDim * stylusRadiusMult;

    ringCtx.beginPath();
    ringCtx.arc(input.x * w, input.y * h, radius, 0, Math.PI * 2);
    ringCtx.stroke();

    // Position the skeuomorphic tool sprite so its tip hovers directly over the area circle center
    syncToolCursorImage();
    const [stageX, stageY] = stageFromWorld(input.x, input.y);
    toolCursor.style.left = `${stageX}px`;
    toolCursor.style.top = `${stageY}px`;
    toolCursor.classList.add("visible");
    toolCursor.classList.toggle("pressing", input.down);
  }

  function layout() {
    updateBathHomography();
    const rect = stage.getBoundingClientRect();
    const W = Math.max(64, rect.width);
    const H = Math.max(64, rect.height);
    const dpr = Math.min(2, window.devicePixelRatio || 1);

    if (isFullScreenMode) {
      const targetW = Math.min(MAX_GPU_TEX, Math.max(64, Math.round(W * dpr)));
      const targetH = Math.min(MAX_GPU_TEX, Math.max(64, Math.round(H * dpr)));
      if (view.width !== targetW || view.height !== targetH) {
        view.width = targetW;
        view.height = targetH;
        ring.width = targetW;
        ring.height = targetH;
      }
      resizeSimulationIfNeeded(W, H, dpr);
    } else {
      const px = Math.round(RENDER_BATH_SIZE * dpr);
      if (view.width !== px || view.height !== px) {
        view.width = px;
        view.height = px;
        ring.width = px;
        ring.height = px;
      }
      resizeSimulationIfNeeded(RENDER_BATH_SIZE, RENDER_BATH_SIZE, dpr);
    }

    drawTo(null, PASS_DISPLAY);
    drawRing();
  }

  // =========================================================
  // Square Image Upload & Interactive Cropper
  // =========================================================
  const floatImageBtn = document.getElementById("float-image-btn");
  const imageUploadInput = document.getElementById("image-upload-input");
  const cropModal = document.getElementById("crop-modal");
  const cropViewport = document.getElementById("crop-viewport");
  const cropCanvas = document.getElementById("crop-canvas");
  const cropZoomSlider = document.getElementById("crop-zoom");
  const cropZoomRead = document.getElementById("crop-zoom-read");
  const cropCancelBtn = document.getElementById("crop-cancel");
  const cropConfirmBtn = document.getElementById("crop-confirm");
  const cropReselectBtn = document.getElementById("crop-reselect-btn");

  const cropState = {
    img: null,
    zoom: 1.0,
    normX: 0.0,
    normY: 0.0,
    dragging: false,
    startX: 0,
    startY: 0,
    startNormX: 0,
    startNormY: 0
  };

  function clampCropOffsets() {
    if (!cropState.img) return;
    const iw = Math.max(1, cropState.img.naturalWidth || cropState.img.width);
    const ih = Math.max(1, cropState.img.naturalHeight || cropState.img.height);
    const coverBase = Math.max(domainX / iw, domainY / ih);
    const normW = ((iw * coverBase) / domainX) * cropState.zoom;
    const normH = ((ih * coverBase) / domainY) * cropState.zoom;
    const maxNormX = Math.max(0, (normW - 1.0) * 0.5);
    const maxNormY = Math.max(0, (normH - 1.0) * 0.5);
    cropState.normX = Math.max(-maxNormX, Math.min(maxNormX, cropState.normX));
    cropState.normY = Math.max(-maxNormY, Math.min(maxNormY, cropState.normY));
  }

  function renderCroppedSquare(targetCanvas) {
    if (!cropState.img) return;
    const tw = targetCanvas.width;
    const th = targetCanvas.height;
    const ctx = targetCanvas.getContext("2d");
    const iw = Math.max(1, cropState.img.naturalWidth || cropState.img.width);
    const ih = Math.max(1, cropState.img.naturalHeight || cropState.img.height);
    const baseScale = Math.max(tw / iw, th / ih);
    const scale = baseScale * cropState.zoom;
    const dw = iw * scale;
    const dh = ih * scale;

    clampCropOffsets();

    const dx = (tw - dw) * 0.5 + cropState.normX * tw;
    const dy = (th - dh) * 0.5 + cropState.normY * th;

    ctx.clearRect(0, 0, tw, th);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(cropState.img, dx, dy, dw, dh);
  }

  function openCropModalWithFile(file) {
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      cropState.img = img;
      cropState.zoom = 1.0;
      cropState.normX = 0.0;
      cropState.normY = 0.0;
      cropZoomSlider.value = "1.0";
      cropZoomRead.textContent = "1.00x";
      const maxDom = Math.max(domainX, domainY);
      cropCanvas.width = Math.max(256, Math.round(680 * (domainX / maxDom)));
      cropCanvas.height = Math.max(256, Math.round(680 * (domainY / maxDom)));
      cropViewport.style.aspectRatio = `${domainX} / ${domainY}`;
      const cropTitle = document.getElementById("crop-modal-title");
      if (cropTitle) {
        cropTitle.textContent = isFullScreenMode ? "Full Bath Crop" : "Square Bath Crop";
      }
      renderCroppedSquare(cropCanvas);
      cropModal.classList.add("open");
    };
    img.src = url;
  }

  function closeCropModal() {
    cropModal.classList.remove("open");
    cropState.dragging = false;
  }

  floatImageBtn.addEventListener("click", () => {
    imageUploadInput.value = "";
    imageUploadInput.click();
  });

  cropReselectBtn.addEventListener("click", () => {
    imageUploadInput.value = "";
    imageUploadInput.click();
  });

  imageUploadInput.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) openCropModalWithFile(file);
  });

  cropZoomSlider.addEventListener("input", (e) => {
    cropState.zoom = parseFloat(e.target.value);
    cropZoomRead.textContent = cropState.zoom.toFixed(2) + "x";
    renderCroppedSquare(cropCanvas);
  });

  cropViewport.addEventListener("pointerdown", (e) => {
    if (!cropState.img) return;
    cropViewport.setPointerCapture(e.pointerId);
    cropState.dragging = true;
    cropState.startX = e.clientX;
    cropState.startY = e.clientY;
    cropState.startNormX = cropState.normX;
    cropState.startNormY = cropState.normY;
    e.preventDefault();
  });

  cropViewport.addEventListener("pointermove", (e) => {
    if (!cropState.dragging) return;
    const rect = cropViewport.getBoundingClientRect();
    const dx = (e.clientX - cropState.startX) / Math.max(1, rect.width);
    const dy = (e.clientY - cropState.startY) / Math.max(1, rect.height);
    cropState.normX = cropState.startNormX + dx;
    cropState.normY = cropState.startNormY + dy;
    renderCroppedSquare(cropCanvas);
  });

  function endCropDrag(e) {
    cropState.dragging = false;
    if (e && e.pointerId !== undefined && cropViewport.hasPointerCapture(e.pointerId)) {
      cropViewport.releasePointerCapture(e.pointerId);
    }
  }

  cropViewport.addEventListener("pointerup", endCropDrag);
  cropViewport.addEventListener("pointercancel", endCropDrag);

  cropViewport.addEventListener("wheel", (e) => {
    if (!cropState.img) return;
    e.preventDefault();
    const nextZoom = Math.max(1.0, Math.min(4.0, cropState.zoom - e.deltaY * 0.002));
    cropState.zoom = nextZoom;
    cropZoomSlider.value = nextZoom.toFixed(2);
    cropZoomRead.textContent = nextZoom.toFixed(2) + "x";
    renderCroppedSquare(cropCanvas);
  }, { passive: false });

  cropCancelBtn.addEventListener("click", closeCropModal);

  cropModal.addEventListener("click", (e) => {
    if (e.target === cropModal) closeCropModal();
  });

  cropConfirmBtn.addEventListener("click", () => {
    if (!cropState.img) return;
    const finalCanvas = document.createElement("canvas");
    finalCanvas.width = inkW;
    finalCanvas.height = inkH;
    renderCroppedSquare(finalCanvas);
    placeImageInBath(finalCanvas);
    closeCropModal();
  });

  // =========================================================
  // Color Picker: Preview while dragging, commit 1 color when closed
  // =========================================================
  const picker = document.getElementById("picker");
  const addColorBtn = document.getElementById("add-to-palette");
  let hasUncommittedColor = false;
  let pendingPickedHex = picker.value;

  function commitSingleNewColor(hex) {
    dynamicPalette.push(["Custom Ink", hex]);
    currentSwatchIndex = dynamicPalette.length - 1;
    renderPalette();
    const buttons = document.querySelectorAll(".swatch");
    if (buttons[currentSwatchIndex]) {
      selectPack(hexToPack(hex), buttons[currentSwatchIndex]);
    }
    hasUncommittedColor = false;
  }

  function flushPendingColorIfAny() {
    if (hasUncommittedColor) {
      commitSingleNewColor(pendingPickedHex);
    }
  }

  picker.addEventListener("input", () => {
    pendingPickedHex = picker.value;
    if (isIOSDevice) {
      hasUncommittedColor = true;
    }
  });

  picker.addEventListener("change", () => {
    pendingPickedHex = picker.value;
    if (isIOSDevice) {
      hasUncommittedColor = true;
    } else {
      commitSingleNewColor(pendingPickedHex);
    }
  });

  picker.addEventListener("blur", () => {
    flushPendingColorIfAny();
  });

  document.addEventListener("pointerdown", (e) => {
    if (hasUncommittedColor && !addColorBtn.contains(e.target)) {
      flushPendingColorIfAny();
    }
  }, true);

  // =========================================================
  // Full-Screen Mode & Docked Hoverable/Touchable Windows
  // =========================================================
  const fullscreenBtn = document.getElementById("fullscreen-btn");
  const fsCornerExitBtn = document.getElementById("fs-corner-exit");
  const topDockCard = document.getElementById("top-dock-card");
  const bathDockCard = document.getElementById("bath-dock-card");
  const topDockTab = document.getElementById("top-dock-tab");
  const bathDockTab = document.getElementById("bath-dock-tab");
  const topDockTabText = document.getElementById("top-dock-tab-text");
  let hadNativeFullscreen = false;

  if (fullscreenBtn) {
    fullscreenBtn.setAttribute("aria-pressed", isFullScreenMode ? "true" : "false");
    fullscreenBtn.title = isFullScreenMode ? "Exit full screen bath" : "Full screen bath";
  }

  function getNativeFullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function closeDockedDrawers() {
    if (topDockCard) topDockCard.classList.remove("dock-open");
    if (bathDockCard) bathDockCard.classList.remove("dock-open");
  }

  function setFullScreenMode(enable) {
    const next = !!enable;
    if (next === isFullScreenMode) return;
    isFullScreenMode = next;

    stage.classList.toggle("fullscreen-mode", isFullScreenMode);
    closeDockedDrawers();

    if (fullscreenBtn) {
      fullscreenBtn.setAttribute("aria-pressed", isFullScreenMode ? "true" : "false");
      fullscreenBtn.title = isFullScreenMode ? "Exit full screen bath" : "Full screen bath";
    }

    if (isFullScreenMode) {
      document.querySelectorAll(".corner-pin").forEach(pin => pin.classList.remove("visible"));
      try {
        const docEl = document.documentElement;
        const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
        if (req && !getNativeFullscreenElement()) {
          const res = req.call(docEl);
          if (res && typeof res.catch === "function") res.catch(() => {});
        }
      } catch (_) {}
    } else {
      try {
        if (getNativeFullscreenElement()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) {
            const res = exit.call(document);
            if (res && typeof res.catch === "function") res.catch(() => {});
          }
        }
      } catch (_) {}
    }

    layout();
    setTimeout(layout, 120);
    setTimeout(layout, 360);
  }

  if (fullscreenBtn) {
    fullscreenBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      setFullScreenMode(!isFullScreenMode);
    });
  }

  if (fsCornerExitBtn) {
    fsCornerExitBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      setFullScreenMode(false);
    });
  }

  function handleNativeFullscreenChange() {
    const fsEl = getNativeFullscreenElement();
    if (fsEl) {
      hadNativeFullscreen = true;
      layout();
      setTimeout(layout, 120);
    } else if (hadNativeFullscreen) {
      hadNativeFullscreen = false;
      if (isFullScreenMode) {
        setFullScreenMode(false);
      }
    }
  }

  document.addEventListener("fullscreenchange", handleNativeFullscreenChange);
  document.addEventListener("webkitfullscreenchange", handleNativeFullscreenChange);

  if (topDockTab && topDockCard) {
    topDockTab.addEventListener("click", (e) => {
      e.stopPropagation();
      const opening = !topDockCard.classList.contains("dock-open");
      topDockCard.classList.toggle("dock-open", opening);
      if (opening && bathDockCard) bathDockCard.classList.remove("dock-open");
    });
  }

  if (bathDockTab && bathDockCard) {
    bathDockTab.addEventListener("click", (e) => {
      e.stopPropagation();
      const opening = !bathDockCard.classList.contains("dock-open");
      bathDockCard.classList.toggle("dock-open", opening);
      if (opening && topDockCard) topDockCard.classList.remove("dock-open");
    });
  }

  view.addEventListener("pointerdown", (e) => {
    flushPendingColorIfAny();
    if (isFullScreenMode) {
      closeDockedDrawers();
    }
    if (pinsModeActive() && pinGesture) { e.preventDefault(); return; } // single-pointer gestures only
    view.setPointerCapture(e.pointerId);
    const p = worldFromEvent(e);
    input.x = p[0]; input.y = p[1];
    input.xPrev = p[0]; input.yPrev = p[1];
    input.vX = 0; input.vY = 0;
    input.prevDirX = input.dirX;
    input.prevDirY = input.dirY;
    input.down = true; input.tap = true; input.inside = true;
    pouredDrop = !pinsModeActive() || isLatteMode();
    if (isLatteMode()) {
      handleLattePointerDown(p[0], p[1]);
    } else if (pinsModeActive()) {
      const hit = findPinAt(p[0], p[1]);
      pinGesture = {
        pointerId: e.pointerId,
        type: hit ? "pull" : "pending",
        pin: hit,
        sx: p[0], sy: p[1],
        px: p[0], py: p[1],
        cx: e.clientX, cy: e.clientY,
        moved: false,
        trail: []
      };
    }
    drawRing();
    e.preventDefault();
  });

  view.addEventListener("pointermove", (e) => {
    const p = worldFromEvent(e);
    input.x = p[0]; input.y = p[1];
    input.inside = true;
    const g = pinGesture;
    if (g && e.pointerId === g.pointerId) {
      g.px = p[0]; g.py = p[1];
      if (!g.moved && Math.hypot(e.clientX - g.cx, e.clientY - g.cy) > PIN_TAP_PX) {
        g.moved = true;
        if (g.type === "pending") {
          g.type = "stroke";
          g.trail.push([g.sx, g.sy]);
          beginMasterStroke(g.sx, g.sy);
        }
      }
      if (g.type === "stroke") {
        g.trail.push([p[0], p[1]]);
        if (g.trail.length > 600) g.trail.splice(0, g.trail.length - 600);
      }
    }
  });

  function cycleColor() {
    if (dynamicPalette.length === 0) return;
    currentSwatchIndex = (currentSwatchIndex + 1) % dynamicPalette.length;
    const buttons = document.querySelectorAll(".swatch");
    if (buttons[currentSwatchIndex]) buttons[currentSwatchIndex].click();
  }

  function endPointer(e) {
    if (pinGesture && (!e || e.pointerId === undefined || e.pointerId === pinGesture.pointerId)) {
      finishPinGesture(!!(e && e.type === "pointercancel"));
    }
    input.down = false;
    if (pouredDrop) {
      if (sumiMode && (activeTool === 0 || isLatteMode())) cycleColor();
      pouredDrop = false;
    }
    if (isLatteMode()) {
      for (const pin of pins) {
        if (pin.kind === "ink") {
          pin.hoverTime = 0;
          pin.lastStampX = pin.x;
          pin.lastStampY = pin.y;
        }
      }
    }
    if (e && e.pointerId !== undefined && view.hasPointerCapture(e.pointerId)) {
      view.releasePointerCapture(e.pointerId);
    }
    drawRing();
  }

  view.addEventListener("pointerup", endPointer);
  view.addEventListener("pointercancel", endPointer);
  view.addEventListener("pointerleave", () => {
    input.inside = false;
    if (!input.down) drawRing();
  });
  view.addEventListener("contextmenu", (e) => e.preventDefault());

  // =========================================================
  // Interactive Corner Calibration ('P' Key to Toggle, 'R' to Reset)
  // =========================================================
  let activePin = null;
  window.addEventListener("keydown", (e) => {
    if (cropModal.classList.contains("open")) {
      if (e.key === "Escape") closeCropModal();
      return;
    }
    if (e.key === "Escape" && isFullScreenMode) {
      setFullScreenMode(false);
      return;
    }
    if ((e.key === "p" || e.key === "P") && !isFullScreenMode) {
      document.querySelectorAll(".corner-pin").forEach(pin => pin.classList.toggle("visible"));
    } else if ((e.key === "f" || e.key === "F" || e.key === " ") && pinsModeActive() && !isLatteMode()) {
      if (activePinKind() === "ink") {
        releaseInkPins();
      } else {
        fireSlingshots();
      }
      e.preventDefault();
    } else if ((e.key === "Delete" || e.key === "Backspace") && pinsModeActive()) {
      clearPinsByKind(activePinKind());
      e.preventDefault();
    } else if ((e.key === "r" || e.key === "R") && document.querySelector(".corner-pin.visible")) {
      bathQuad = DEFAULT_BATH_QUAD.map(pt => [pt[0], pt[1]]);
      localStorage.removeItem("suminagashi_bath_quad_v2");
      updateBathHomography();
    }
  });

  document.querySelectorAll(".corner-pin").forEach(pin => {
    pin.addEventListener("pointerdown", (e) => {
      pin.setPointerCapture(e.pointerId);
      activePin = parseInt(pin.getAttribute("data-corner"), 10);
      e.stopPropagation();
      e.preventDefault();
    });
    pin.addEventListener("pointermove", (e) => {
      if (activePin === null) return;
      const rect = stage.getBoundingClientRect();
      const nx = Math.max(0.05, Math.min(0.95, (e.clientX - rect.left) / rect.width));
      const ny = Math.max(0.05, Math.min(0.95, (e.clientY - rect.top) / rect.height));
      bathQuad[activePin] = [nx, ny];
      updateBathHomography();
    });
    pin.addEventListener("pointerup", (e) => {
      if (activePin !== null) {
        activePin = null;
        try {
          localStorage.setItem("suminagashi_bath_quad_v2", JSON.stringify(bathQuad));
        } catch (_) {}
        console.log("Updated BATH_QUAD:", JSON.stringify(bathQuad));
      }
      if (pin.hasPointerCapture(e.pointerId)) pin.releasePointerCapture(e.pointerId);
    });
  });

  // Tool Hotspot Selection (Brushes vs Bamboo Stick)
  document.querySelectorAll(".tool-hotspot").forEach(btn => {
    btn.addEventListener("click", () => {
      const clickedTool = parseInt(btn.getAttribute("data-tool"), 10);
      const wasAlreadyActive = (activeTool === clickedTool);

      document.querySelectorAll(".tool-hotspot").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".top-view").forEach(p => p.classList.remove("active"));

      btn.classList.add("active");
      activeTool = clickedTool;
      if (topDockTabText) {
        topDockTabText.textContent = activeTool === 0 ? "Inks" : "Stick";
      }
      if (isFullScreenMode && topDockCard && !window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        if (wasAlreadyActive) {
          topDockCard.classList.toggle("dock-open");
        } else {
          topDockCard.classList.add("dock-open");
        }
        if (bathDockCard) bathDockCard.classList.remove("dock-open");
      }

      if (!pinsModeActive() && pinGesture) finishPinGesture(true);
      if (activeTool === 0 && pushInkActive) ensureLattePins();
      const panel = document.getElementById(`panel-${activeTool}`);
      if (panel) panel.classList.add("active");

      syncToolCursorImage();
      updatePinUI();
      if (input.inside) drawRing();
    });
  });

  // Sumi Inks dual-clickable sub-mode: Drop (always base active) + Push (optional pin-push pour)
  const inkPinControls = document.getElementById("ink-pin-controls");
  const dropModeBtn = document.querySelector('[data-ink-mode="drop"]');
  const pushModeBtn = document.querySelector('[data-ink-mode="push"]');

  function syncInkModeUI() {
    if (dropModeBtn) {
      dropModeBtn.classList.add("active");
      dropModeBtn.setAttribute("aria-pressed", "true");
    }
    if (pushModeBtn) {
      pushModeBtn.classList.toggle("active", pushInkActive);
      pushModeBtn.setAttribute("aria-pressed", pushInkActive ? "true" : "false");
    }
    if (inkPinControls) {
      inkPinControls.classList.toggle("active", pushInkActive);
    }
    if (pushInkActive) {
      ensureLattePins();
    }
    view.setAttribute("aria-label", pushInkActive
      ? "Suminagashi water bath. Drop + Push mode: drag to pour fluid while pushing pin; touch anywhere to relocate."
      : "Suminagashi water bath. Hold to drop and pour ink.");
    updatePinUI();
    drawRing();
  }

  document.querySelectorAll("[data-ink-mode]").forEach(btn => {
    btn.addEventListener("click", () => {
      const mode = btn.getAttribute("data-ink-mode");
      if (mode === "push") {
        pushInkActive = !pushInkActive;
      } else {
        pushInkActive = false;
      }
      if (pinGesture) finishPinGesture(true);
      syncInkModeUI();
    });
  });

  // Bamboo Stick sub-mode (Stir vs Pins) + pin controls
  const pinControls = document.getElementById("pin-controls");
  document.querySelectorAll("[data-stick-mode]").forEach(btn => {
    btn.addEventListener("click", () => {
      stickMode = btn.getAttribute("data-stick-mode");
      document.querySelectorAll("[data-stick-mode]").forEach(b => {
        const on = b === btn;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      if (pinGesture) finishPinGesture(true);
      pinControls.classList.toggle("active", stickMode === "pins");
      view.setAttribute("aria-label", stickMode === "pins"
        ? "Suminagashi water bath. Tap to place pins, drag a pin back to aim it, drag the water to sweep."
        : "Suminagashi water bath. Hold to pour ink.");
      updatePinUI();
      drawRing();
    });
  });

  // Grid Dropdown Toggles and Action
  const inkGridBtn = document.getElementById("ink-grid-btn");
  const inkGridMenu = document.getElementById("ink-grid-menu");
  const stickGridBtn = document.getElementById("stick-grid-btn");
  const stickGridMenu = document.getElementById("stick-grid-menu");

  if (inkGridBtn && inkGridMenu) {
    inkGridBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      inkGridMenu.classList.toggle("open");
      if (stickGridMenu) stickGridMenu.classList.remove("open");
    });
  }
  if (stickGridBtn && stickGridMenu) {
    stickGridBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      stickGridMenu.classList.toggle("open");
      if (inkGridMenu) inkGridMenu.classList.remove("open");
    });
  }

  document.addEventListener("click", (e) => {
    if (inkGridMenu && !inkGridMenu.contains(e.target) && e.target !== inkGridBtn) {
      inkGridMenu.classList.remove("open");
    }
    if (stickGridMenu && !stickGridMenu.contains(e.target) && e.target !== stickGridBtn) {
      stickGridMenu.classList.remove("open");
    }
  });

  document.querySelectorAll("[data-grid]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const tool = btn.getAttribute("data-grid-tool") || (activePinKind() || "ink");
      const gridType = btn.getAttribute("data-grid");
      generatePinGrid(tool, gridType);
      if (inkGridMenu) inkGridMenu.classList.remove("open");
      if (stickGridMenu) stickGridMenu.classList.remove("open");
    });
  });

  // Ink Push Pin actions
  document.getElementById("ink-pin-clear").addEventListener("click", () => { clearPinsByKind("ink"); });

  // Stick Pin actions
  document.getElementById("pin-fire").addEventListener("click", () => { fireSlingshots(); });
  document.getElementById("pin-clear").addEventListener("click", () => { clearPinsByKind("stick"); });
  document.getElementById("pin-keep").addEventListener("change", (e) => { keepStickPins = e.target.checked; });
  updatePinUI();

  // Washi Paper Stack Export Menu Toggle
  const washiTrigger = document.getElementById("washi-trigger");
  const washiMenu = document.getElementById("washi-menu");
  washiTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    washiMenu.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!washiMenu.contains(e.target) && e.target !== washiTrigger) {
      washiMenu.classList.remove("open");
    }
  });

  function renderPalette() {
    const swatchBox = document.getElementById("swatches");
    swatchBox.innerHTML = "";
    dynamicPalette.forEach(([name, hex], index) => {
      const wrap = document.createElement("div");
      wrap.className = "swatch-wrap";

      const button = document.createElement("button");
      button.type = "button";
      button.className = "swatch";
      button.title = name;
      button.setAttribute("aria-label", name);
      button.style.background = hex;
      button.setAttribute("aria-pressed", currentSwatchIndex === index ? "true" : "false");
      button.addEventListener("click", () => {
        currentSwatchIndex = index;
        selectPack(hexToPack(hex), button);
      });

      wrap.appendChild(button);

      if (dynamicPalette.length > 1) {
        const del = document.createElement("div");
        del.className = "swatch-del";
        del.innerHTML = "&times;";
        del.title = "Remove ink";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          dynamicPalette.splice(index, 1);
          if (currentSwatchIndex >= dynamicPalette.length) {
            currentSwatchIndex = Math.max(0, dynamicPalette.length - 1);
          }
          renderPalette();
          const buttons = document.querySelectorAll(".swatch");
          if (buttons[currentSwatchIndex]) buttons[currentSwatchIndex].click();
        });
        wrap.appendChild(del);
      }

      swatchBox.appendChild(wrap);
    });
  }

  renderPalette();

  function selectPack(packed, el) {
    ink = packed;
    document.querySelectorAll(".swatch").forEach((node) => {
      node.setAttribute("aria-pressed", node === el ? "true" : "false");
    });
    const hex = dynamicPalette[currentSwatchIndex] ? dynamicPalette[currentSwatchIndex][1] : "#161514";
    for (const pin of pins) {
      if (pin.kind === "ink" && pin.state === "idle") {
        pin.color = packed;
        pin.colorHex = hex;
      }
    }
    drawRing();
  }

  document.getElementById("sumi-mode").addEventListener("change", (e) => { sumiMode = e.target.checked; });

  const waterSwatchLabel = document.getElementById("water-swatch-label");
  document.getElementById("bath-color").addEventListener("input", (e) => {
    const hex = e.target.value;
    if (waterSwatchLabel) waterSwatchLabel.style.background = hex;
    const n = parseInt(hex.slice(1), 16);
    gl.useProgram(program);
    gl.uniform3f(uWater, ((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    reset();
  });

  document.getElementById("diffusion").addEventListener("input", (e) => {
    diffValue = parseFloat(e.target.value);
    document.getElementById("diffusion-read").textContent = Math.round(diffValue * 100) + "%";
  });

  document.getElementById("glide").addEventListener("input", (e) => {
    glideValue = parseFloat(e.target.value);
    document.getElementById("glide-read").textContent = Math.round(glideValue * 100) + "%";
  });

  document.getElementById("vorticity").addEventListener("input", (e) => {
    vortValue = parseFloat(e.target.value);
    document.getElementById("vorticity-read").textContent = Math.round(vortValue * 100) + "%";
  });

  document.getElementById("size").addEventListener("input", (e) => {
    dropSizeMult = parseFloat(e.target.value);
    document.getElementById("size-read").textContent = dropSizeMult.toFixed(1) + "x";
    if (input.inside) drawRing();
  });
  document.getElementById("flow").addEventListener("input", (e) => {
    flowRateMult = parseFloat(e.target.value);
    document.getElementById("flow-read").textContent = flowRateMult.toFixed(1) + "x";
  });

  document.getElementById("stick-size").addEventListener("input", (e) => {
    stylusRadiusMult = parseFloat(e.target.value);
    document.getElementById("stick-size-read").textContent = stylusRadiusMult.toFixed(1) + "x";
    if (input.inside) drawRing();
  });
  document.getElementById("stick-drag").addEventListener("input", (e) => {
    stylusDragMult = parseFloat(e.target.value);
    document.getElementById("stick-drag-read").textContent = stylusDragMult.toFixed(1) + "x";
  });

  document.getElementById("clear").addEventListener("click", reset);

  document.getElementById("export-jpg").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = exportHighRes("image/jpeg");
    a.download = "suminagashi.jpg";
    a.click();
    washiMenu.classList.remove("open");
  });

  function exportTrueVectorSVG(maxLongSide = 2048) {
      const maxInk = Math.max(inkW, inkH);
      const gridScale = maxLongSide / maxInk;
      const W = Math.max(64, Math.round(inkW * gridScale));
      const H = Math.max(64, Math.round(inkH * gridScale));

      // 1. Render unshadowed flat-color bath matching active bath aspect ratio
      const exportFbo = gl.createFramebuffer();
      const exportTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, exportTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, exportFbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, exportTex, 0);

      gl.viewport(0, 0, W, H);
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1i(uIsExportLoc, 1);
      gl.uniform1i(uPass, PASS_DISPLAY);
      gl.uniform2f(uTargetSize, W, H);
      bindInputs(null);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.uniform1i(uIsExportLoc, 0);

      const pixels = new Uint8Array(W * H * 4);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

      gl.deleteTexture(exportTex);
      gl.deleteFramebuffer(exportFbo);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, view.width, view.height);

      // 2. Dynamic Color Quantization (Preserves floated photo colors alongside inks)
      const waterHex = (document.getElementById("bath-color").value || "#b8b0a2").toLowerCase();
      const hexToRgb = (hex) => {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      };
      const rgbToHex = (r, g, b) => {
        const toByte = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
        return `#${toByte(r)}${toByte(g)}${toByte(b)}`;
      };

      const layers = [{ name: "Water_Bath", hex: waterHex, rgb: hexToRgb(waterHex) }];
      const seenHex = new Set([waterHex]);

      dynamicPalette.forEach(([name, hex]) => {
        const lower = hex.toLowerCase();
        if (!seenHex.has(lower)) {
          seenHex.add(lower);
          layers.push({ name, hex: lower, rgb: hexToRgb(lower) });
        }
      });

      const rawLabels = new Uint8Array(W * H);

      // First pass: map pixels to existing palette or auto-cluster photo colors into max 24 bands
      for (let y = 0; y < H; y++) {
        const srcRow = (H - 1 - y) * W * 4;
        const dstRow = y * W;
        for (let x = 0; x < W; x++) {
          const i = srcRow + x * 4;
          const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
          const a = pixels[i + 3];

          if (a < 10) {
            rawLabels[dstRow + x] = 0;
            continue;
          }

          let bestK = 0;
          let bestDist = 1e9;
          for (let k = 0; k < layers.length; k++) {
            const dr = layers[k].rgb[0] - r;
            const dg = layers[k].rgb[1] - g;
            const db = layers[k].rgb[2] - b;
            const d2 = dr * dr + dg * dg + db * db;
            if (d2 < bestDist) {
              bestDist = d2;
              bestK = k;
            }
          }

          // If pixel color is distant from current palette (e.g. floated image), quantize into new shade bucket
          if (bestDist > 650.0 && layers.length < 24) {
            const qr = Math.round(r / 32) * 32;
            const qg = Math.round(g / 32) * 32;
            const qb = Math.round(b / 32) * 32;
            const qHex = rgbToHex(qr, qg, qb);

            let foundBin = -1;
            for (let k = 1; k < layers.length; k++) {
              if (layers[k].hex === qHex) {
                foundBin = k;
                break;
              }
            }

            if (foundBin !== -1) {
              bestK = foundBin;
            } else {
              bestK = layers.length;
              seenHex.add(qHex);
              layers.push({ name: `Photo_${bestK}`, hex: qHex, rgb: [qr, qg, qb] });
            }
          }

          rawLabels[dstRow + x] = bestK;
        }
      }

      function smoothClosedLoop(pts, iterations = 5) {
        const len = pts.length;
        if (len < 6) return pts;
        let curr = pts.map(p => [p[0], p[1]]);
        let next = pts.map(p => [p[0], p[1]]);
        const isBorder = (p) => (p[0] <= 0 || p[0] >= W || p[1] <= 0 || p[1] >= H);

        const step = (src, dst, w) => {
          for (let i = 0; i < len; i++) {
            const p = src[i];
            if (isBorder(p)) {
              dst[i][0] = p[0];
              dst[i][1] = p[1];
              continue;
            }
            const prev = src[(i - 1 + len) % len];
            const nxt = src[(i + 1) % len];
            dst[i][0] = p[0] + w * (0.5 * (prev[0] + nxt[0]) - p[0]);
            dst[i][1] = p[1] + w * (0.5 * (prev[1] + nxt[1]) - p[1]);
          }
        };

        for (let it = 0; it < iterations; it++) {
          step(curr, next, 0.50);
          step(next, curr, -0.52);
        }
        return curr;
      }

      function simplifyClosedLoop(pts, epsilon = 0.45) {
        if (pts.length <= 6) return pts;
        function sqSegDist(p, p1, p2) {
          let x = p1[0], y = p1[1], dx = p2[0] - x, dy = p2[1] - y;
          if (dx !== 0 || dy !== 0) {
            const t = ((p[0] - x) * dx + (p[1] - y) * dy) / (dx * dx + dy * dy);
            if (t > 1) { x = p2[0]; y = p2[1]; }
            else if (t > 0) { x += dx * t; y += dy * t; }
          }
          dx = p[0] - x; dy = p[1] - y;
          return dx * dx + dy * dy;
        }
        function rdp(start, end, arr, out) {
          let maxD = 0, index = start;
          for (let i = start + 1; i < end; i++) {
            const d = sqSegDist(arr[i], arr[start], arr[end]);
            if (d > maxD) { maxD = d; index = i; }
          }
          if (maxD > epsilon * epsilon) {
            rdp(start, index, arr, out);
            out.push(arr[index]);
            rdp(index, end, arr, out);
          }
        }
        let splitIdx = Math.floor(pts.length / 2);
        const half1 = [pts[0]];
        rdp(0, splitIdx, pts, half1);
        half1.push(pts[splitIdx]);

        const half2 = [pts[splitIdx]];
        const closedPts = pts.concat([pts[0]]);
        rdp(splitIdx, closedPts.length - 1, closedPts, half2);

        return half1.concat(half2.slice(1));
      }

      function loopToBSplinePath(pts) {
        const len = pts.length;
        if (len < 3) return "";
        const mid = (a, b) => [0.5 * (a[0] + b[0]), 0.5 * (a[1] + b[1])];
        const m0 = mid(pts[len - 1], pts[0]);
        let d = `M ${m0[0].toFixed(2)} ${m0[1].toFixed(2)}`;
        let prevMid = m0;

        for (let i = 0; i < len; i++) {
          const p = pts[i];
          const nextP = pts[(i + 1) % len];
          const currMid = mid(p, nextP);
          const cp1x = (prevMid[0] + 2.0 * p[0]) / 3.0;
          const cp1y = (prevMid[1] + 2.0 * p[1]) / 3.0;
          const cp2x = (currMid[0] + 2.0 * p[0]) / 3.0;
          const cp2y = (currMid[1] + 2.0 * p[1]) / 3.0;
          d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${currMid[0].toFixed(2)} ${currMid[1].toFixed(2)}`;
          prevMid = currMid;
        }
        return d + " Z";
      }

      const VW = W + 1;
      const VH = H + 1;
      const outMask = new Uint8Array(VW * VH);
      const DX = [1, 0, -1, 0];
      const DY = [0, 1, 0, -1];
      const svgGroups = [];

      for (let k = 1; k < layers.length; k++) {
        outMask.fill(0);
        for (let y = 0; y < H; y++) {
          const row = y * W;
          const vRow0 = y * VW;
          const vRow1 = (y + 1) * VW;
          for (let x = 0; x < W; x++) {
            if (rawLabels[row + x] !== k) continue;
            if (y === 0 || rawLabels[row - W + x] !== k) outMask[vRow0 + x] |= 1;
            if (x === W - 1 || rawLabels[row + x + 1] !== k) outMask[vRow0 + x + 1] |= 2;
            if (y === H - 1 || rawLabels[row + W + x] !== k) outMask[vRow1 + x + 1] |= 4;
            if (x === 0 || rawLabels[row + x - 1] !== k) outMask[vRow1 + x] |= 8;
          }
        }

        const pathStrings = [];
        for (let sy = 0; sy <= H; sy++) {
          const vRow = sy * VW;
          for (let sx = 0; sx <= W; sx++) {
            if (outMask[vRow + sx] === 0) continue;
            for (let initDir = 0; initDir < 4; initDir++) {
              if (!(outMask[vRow + sx] & (1 << initDir))) continue;

              const loop = [];
              let vx = sx, vy = sy, dir = initDir;
              while (true) {
                loop.push([vx, vy]);
                const vIdx = vy * VW + vx;
                outMask[vIdx] &= ~(1 << dir);
                vx += DX[dir];
                vy += DY[dir];
                if (vx === sx && vy === sy) break;
                const nextMask = outMask[vy * VW + vx];
                if (nextMask === 0) break;

                const rDir = (dir + 1) & 3, sDir = dir, lDir = (dir + 3) & 3, bDir = (dir + 2) & 3;
                if (nextMask & (1 << rDir)) dir = rDir;
                else if (nextMask & (1 << sDir)) dir = sDir;
                else if (nextMask & (1 << lDir)) dir = lDir;
                else dir = bDir;
              }

              if (loop.length >= 4) {
                const smoothed = smoothClosedLoop(loop, 5);
                const simplified = simplifyClosedLoop(smoothed, 0.45);
                if (simplified.length >= 3) {
                  pathStrings.push(loopToBSplinePath(simplified));
                }
              }
            }
          }
        }

        if (pathStrings.length > 0) {
          const safeId = layers[k].name.replace(/[^a-zA-Z0-9_-]/g, "_");
          svgGroups.push(
            `  <g id="${safeId}_layer_${k}">\n` +
            `    <path fill="${layers[k].hex}" fill-rule="evenodd" d="${pathStrings.join(" ")}" />\n` +
            `  </g>`
          );
        }
      }

      return [
        `<?xml version="1.0" encoding="UTF-8"?>`,
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`,
        `  <rect id="water_bath" width="${W}" height="${H}" fill="${waterHex}" />`,
        ...svgGroups,
        `</svg>`
      ].join("\n");
    }

    document.getElementById("export-svg").addEventListener("click", () => {
      const svgString = exportTrueVectorSVG(2048);
      const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "suminagashi.svg";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      washiMenu.classList.remove("open");
    });

  // Keep bath homography aligned across portrait load, iPad rotation, and visualViewport changes
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => {
    layout();
    setTimeout(layout, 120);
    setTimeout(layout, 360);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", layout);
    window.visualViewport.addEventListener("scroll", layout);
  }
  if (typeof ResizeObserver !== "undefined") {
    const stageObserver = new ResizeObserver(() => layout());
    stageObserver.observe(stage);
  }

  let last = performance.now();
  let acc = 0;

  function frame(now) {
    let delta = (now - last) / 1000;
    last = now;
    if (delta > 0.05) delta = 0.05;

    input.prevDirX = input.dirX;
    input.prevDirY = input.dirY;

    const dx = input.x - input.xPrev;
    const dy = input.y - input.yPrev;
    const dist = Math.hypot(dx, dy);

    if (input.down && delta > 1e-5) {
      input.vX = dx / delta;
      input.vY = dy / delta;
      if (dist > 0.0008) {
        const targetDirX = dx / dist;
        const targetDirY = dy / dist;
        const casterTurn = Math.min(1.0, dist / 0.032);
        input.dirX += (targetDirX - input.dirX) * casterTurn;
        input.dirY += (targetDirY - input.dirY) * casterTurn;
        const dLen = Math.hypot(input.dirX, input.dirY) || 1.0;
        input.dirX /= dLen;
        input.dirY /= dLen;
      }
    } else {
      input.vX = 0;
      input.vY = 0;
    }

    acc += delta;
    const totalSteps = Math.min(2, Math.floor(acc / DT));
    let steps = 0;
    let painted = false;
    if (totalSteps > 0) {
      const startX = input.xPrev;
      const startY = input.yPrev;
      const endX = input.x;
      const endY = input.y;
      const stepDt = Math.max(delta / totalSteps, DT);
      for (let s = 0; s < totalSteps; s++) {
        const t1 = (s + 1) / totalSteps;
        input.x = startX + (endX - startX) * t1;
        input.y = startY + (endY - startY) * t1;
        if (step(DT, stepDt)) painted = true;
        input.xPrev = input.x;
        input.yPrev = input.y;
        input.prevDirX = input.dirX;
        input.prevDirY = input.dirY;
        acc -= DT;
        steps++;
      }
      input.x = endX;
      input.y = endY;
    }
    if (steps === 2) acc = 0;

    if (painted) drawTo(null, PASS_DISPLAY);
    if (steps > 0 || input.inside || input.down || pins.length > 0) drawRing();
    requestAnimationFrame(frame);
  }

  layout();
  seedInitialBath();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
